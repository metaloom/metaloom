{{/* "What MetaLoom does" art: one asset fanning out into the workers that describe it, and back
     into a single index. Geometry here, colour + motion in tour.css (.st-pv-*). */}}
<figure class="st-pipeline">
  <svg viewBox="0 0 920 300" class="st-pv" role="img" aria-labelledby="st-pv-title st-pv-desc">
    <title id="st-pv-title">How MetaLoom processes an asset</title>
    <desc id="st-pv-desc">A media file is dispatched to four kinds of processing worker — speech,
      faces, scenes and fingerprints — whose results are collected into one searchable index.</desc>

    <defs>
      <linearGradient id="st-pv-node" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#1d3b3d"/>
        <stop offset="100%" stop-color="#14212a"/>
      </linearGradient>
      <linearGradient id="st-pv-index" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="rgba(87,203,204,.20)"/>
        <stop offset="100%" stop-color="rgba(87,203,204,.04)"/>
      </linearGradient>
    </defs>

    {{/* edges: source → workers */}}
    <g class="st-pv-edges">
      <path class="st-pv-edge" d="M168 150 C 250 150, 260 43, 340 43"/>
      <path class="st-pv-edge" d="M168 150 C 250 150, 260 107, 340 107"/>
      <path class="st-pv-edge" d="M168 150 C 250 150, 260 171, 340 171"/>
      <path class="st-pv-edge" d="M168 150 C 250 150, 260 235, 340 235"/>
      <path class="st-pv-edge" d="M560 43  C 640 43, 650 150, 730 150"/>
      <path class="st-pv-edge" d="M560 107 C 640 107, 650 150, 730 150"/>
      <path class="st-pv-edge" d="M560 171 C 640 171, 650 150, 730 150"/>
      <path class="st-pv-edge" d="M560 235 C 640 235, 650 150, 730 150"/>
    </g>
    <g class="st-pv-flows">
      <path class="st-pv-flow" style="--st-delay:0s"   d="M168 150 C 250 150, 260 43, 340 43"/>
      <path class="st-pv-flow" style="--st-delay:.25s" d="M168 150 C 250 150, 260 107, 340 107"/>
      <path class="st-pv-flow" style="--st-delay:.5s"  d="M168 150 C 250 150, 260 171, 340 171"/>
      <path class="st-pv-flow" style="--st-delay:.75s" d="M168 150 C 250 150, 260 235, 340 235"/>
      <path class="st-pv-flow" style="--st-delay:1.1s" d="M560 43  C 640 43, 650 150, 730 150"/>
      <path class="st-pv-flow" style="--st-delay:1.3s" d="M560 107 C 640 107, 650 150, 730 150"/>
      <path class="st-pv-flow" style="--st-delay:1.5s" d="M560 171 C 640 171, 650 150, 730 150"/>
      <path class="st-pv-flow" style="--st-delay:1.7s" d="M560 235 C 640 235, 650 150, 730 150"/>
    </g>

    {{/* the incoming asset */}}
    <g class="st-pv-source">
      <rect x="18" y="112" width="150" height="76" rx="12"/>
      <polygon class="st-pv-play" points="72,138 72,162 96,150"/>
      <text class="st-pv-source-label" x="93" y="182" text-anchor="middle">one file</text>
    </g>

    {{/* the workers */}}
    <g class="st-pv-workers">
      <g class="st-pv-worker" style="--st-delay:.2s">
        <rect x="340" y="22" width="220" height="42" rx="21"/>
        <text x="450" y="49" text-anchor="middle">listens · speech to text</text>
      </g>
      <g class="st-pv-worker" style="--st-delay:.35s">
        <rect x="340" y="86" width="220" height="42" rx="21"/>
        <text x="450" y="113" text-anchor="middle">looks · faces &amp; scenes</text>
      </g>
      <g class="st-pv-worker" style="--st-delay:.5s">
        <rect x="340" y="150" width="220" height="42" rx="21"/>
        <text x="450" y="177" text-anchor="middle">reads · text &amp; documents</text>
      </g>
      <g class="st-pv-worker" style="--st-delay:.65s">
        <rect x="340" y="214" width="220" height="42" rx="21"/>
        <text x="450" y="241" text-anchor="middle">matches · fingerprints</text>
      </g>
    </g>

    {{/* the index */}}
    <g class="st-pv-index">
      <rect x="730" y="72" width="172" height="156" rx="14"/>
      <text class="st-pv-index-title" x="816" y="102" text-anchor="middle">one index</text>
      <g class="st-pv-index-rows">
        <rect x="752" y="118" width="128" height="10" rx="5" style="--st-delay:1.9s"/>
        <rect x="752" y="140" width="104" height="10" rx="5" style="--st-delay:2s"/>
        <rect x="752" y="162" width="128" height="10" rx="5" style="--st-delay:2.1s"/>
        <rect x="752" y="184" width="86"  height="10" rx="5" style="--st-delay:2.2s"/>
      </g>
      <circle class="st-pv-index-dot" cx="816" cy="212" r="4"/>
    </g>
  </svg>
</figure>
