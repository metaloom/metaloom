{{ define "main" }}

{{ partial "navigation.html" . }}

<section class="section docs-section">
  <div class="container">
    <div class="row">
      <div class="col-lg-3 d-none d-lg-block">
        <div class="docs-sidebar toc-sticky-top">
          <nav id="toc"></nav>
        </div>
      </div>
      <div class="col-lg-9">
        <div class="docs-page-header">
          <h1>{{ .Title }}</h1>
        </div>
        <div class="post-single-content docs-main-content">
          {{ .Content }}
        </div>
      </div>
    </div>
  </div>
</section>
{{ end }}
