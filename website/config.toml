############################# Default Parameters ##########################
[params]
logo = "images/logo_word_big.svg"
# Community link — used by the header icon and available to any page that needs it.
discordLink = "https://discord.gg/NFdnFcSbfA"
# Base for the absolute URLs in the social metadata (partials/card.html). It duplicates
# `baseURL` on purpose: Hugo intermittently resolves site.BaseURL to its default
# "http://localhost:1313/" for a handful of pages when the theme CSS is rebuilt in the same
# run, which would bake the build machine into canonical/og:url/og:image. A plain param
# cannot be defaulted that way. Keep it in sync with `baseURL` above.
canonical_base = "https://metaloom.io"
# Meta data — the site-wide fallback for <meta name="description"> and the social cards
# (partials/card.html). Pages should set their own `description:` in front matter.
description = "MetaLoom is an open source media asset platform: it transcribes, detects, describes and indexes your media — on your own hardware."
author = "Jotschi"
# Google Analytics
google_analytics_id = "" # Your ID
# post share
post_share = false

# preloader
[params.preloader]
enable = false
preloader = "images/logo_word_big.svg"

# cookies
[params.cookies]
enable = false
expire_days = 2

# Rendered as the icon row in the footer. `label` is used as the accessible name.
# Icons may come from the Themify pack (ti-*) or FontAwesome 5 (fab/fas), both loaded globally.
[[params.social]]
icon = "fab fa-discord"
label = "Discord"
link = "https://discord.gg/NFdnFcSbfA"

[[params.social]]
icon = "fab fa-github"
label = "GitHub"
link = "https://github.com/metaloom"

[[params.social]]
icon = "ti-email"
label = "hello@metaloom.io"
link = "mailto:hello@metaloom.io"


