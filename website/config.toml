################### English Navigation ########################
# Five top-level entries, three of which open a dropdown. Everything the header reaches appears
# EXACTLY ONCE: the five products under *Products*, the two reference surfaces under *Docs*, the
# two written ones under *Blog*. Before this, Studio, Graph, Pipeline Editor and Announcements
# each held a slot of their own and the bar ran out of room between 992 and 1200 px.
#
# A parent with children is a disclosure button, not a link — a reader never has to guess whether
# clicking it navigates or opens. Where the parent has a landing page of its own, that page is the
# FIRST item in its panel ("All documentation", "All posts"), so nothing becomes unreachable.
#
# `[Languages.en.menu.main.params]` after an entry carries a `note`, rendered as the second line
# of the dropdown item. Keep it to one short phrase — it is a label, not a sentence.
#
# Rendering: partials/navigation.html · styling: the `.nav-has-menu` block in
# less/includes/custom.less · behaviour: the header-dropdown IIFE in assets/js/script.js.

# ---------------------------------------------------------------- Products (no page of its own)
[[Languages.en.menu.main]]
identifier = "products"
name = "Products"
weight = 1

[[Languages.en.menu.main]]
parent = "products"
name = "MetaLoom // Loom"
url = "loom"
weight = 1
  [Languages.en.menu.main.params]
  note = "The asset server — APIs, storage, search, UI"

[[Languages.en.menu.main]]
parent = "products"
name = "MetaLoom // Cortex"
url = "cortex"
weight = 2
  [Languages.en.menu.main.params]
  note = "The processing engine and its 45 node kinds"

# The graph database. Its own top-level section rather than a page under /docs/, because it is a
# separate product with its own repository — and it carries its own reference tree, so it renders
# through layouts/graph/ and reuses the docs topic rail via the partial's `root` argument.
[[Languages.en.menu.main]]
parent = "products"
name = "MetaLoom // Graph"
url = "graph"
weight = 3
  [Languages.en.menu.main.params]
  note = "Native-code graph database for Java"

# The commercial edition. Deliberately singular ("Studio") and distinct from the /tour/ page
# below, which used to sit at /studios/ and confused the two.
[[Languages.en.menu.main]]
parent = "products"
name = "MetaLoom // Studio"
url = "studio"
weight = 4
  [Languages.en.menu.main.params]
  note = "Self-hosted commercial edition"

[[Languages.en.menu.main]]
parent = "products"
