<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"
     aria-label="Moving a file to another disk: copy to a temporary name, carry the checksum across, publish it, verify it, and only then remove the original.">
  <title>What happens when a file crosses to another disk</title>
  <desc>The original is only removed after the copy at the destination has been verified to hold the same content. Every failure leaves the original in place.</desc>

  <style>
    .box   { fill: #f4f6f8; stroke: #b9c2cc; stroke-width: 1.5; rx: 6; }
    .safe  { fill: #eaf5ec; stroke: #6aa877; stroke-width: 1.5; rx: 6; }
    .risk  { fill: #fdf0ec; stroke: #d08a72; stroke-width: 1.5; rx: 6; }
    .lbl   { font: 500 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #24303c; }
    .sub   { font: 400 11.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #5b6875; }
    .head  { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #24303c; }
    .flow  { stroke: #7a8794; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .stop  { stroke: #c0674a; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; marker-end: url(#b); }
    .stoplbl { font: 500 11.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #a8543a; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a8794"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0674a"/>
    </marker>
  </defs>

  <text class="head" x="16" y="24">Moving a file to another disk</text>
  <text class="sub"  x="16" y="42">Within one disk this is a rename and none of it is needed. Across disks, every byte is copied.</text>

  <rect class="box" x="16"  y="70" width="128" height="62"/>
  <text class="lbl" x="80" y="95"  text-anchor="middle">Copy</text>
  <text class="sub" x="80" y="113" text-anchor="middle">to a temporary</text>
  <text class="sub" x="80" y="126" text-anchor="middle">name</text>

  <rect class="box" x="172" y="70" width="128" height="62"/>
  <text class="lbl" x="236" y="95"  text-anchor="middle">Carry across</text>
  <text class="sub" x="236" y="113" text-anchor="middle">the cached</text>
  <text class="sub" x="236" y="126" text-anchor="middle">checksum</text>

  <rect class="box" x="328" y="70" width="128" height="62"/>
  <text class="lbl" x="392" y="95"  text-anchor="middle">Publish</text>
  <text class="sub" x="392" y="113" text-anchor="middle">rename into its</text>
  <text class="sub" x="392" y="126" text-anchor="middle">final place</text>

  <rect class="safe" x="484" y="70" width="128" height="62"/>
  <text class="lbl" x="548" y="95"  text-anchor="middle">Verify</text>
  <text class="sub" x="548" y="113" text-anchor="middle">same content</text>
  <text class="sub" x="548" y="126" text-anchor="middle">at the target?</text>

  <rect class="risk" x="640" y="70" width="104" height="62"/>
  <text class="lbl" x="692" y="95"  text-anchor="middle">Remove</text>
  <text class="sub" x="692" y="113" text-anchor="middle">the original</text>
  <text class="sub" x="692" y="126" text-anchor="middle">— if asked</text>

  <path class="flow" d="M144 101 H170"/>
  <path class="flow" d="M300 101 H326"/>
  <path class="flow" d="M456 101 H482"/>
  <path class="flow" d="M612 101 H638"/>

  <path class="stop" d="M548 132 V186 H236 V140"/>
  <text class="stoplbl" x="392" y="204" text-anchor="middle">If it does not match: the copy is removed and the original is kept</text>

  <rect class="safe" x="16" y="228" width="728" height="56"/>
  <text class="lbl" x="32" y="252">The original is only ever removed at the last step, and only when you asked for it.</text>
  <text class="sub" x="32" y="271">Interrupt the run at any earlier point and the destination holds nothing visible, while the original is untouched.</text>
</svg>
