//// ==========================================================================
//// Task
//// ==========================================================================

Table task as TASK [headercolor: #16A085] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  title varchar [not null]
  content varchar [note: "Description of the task"]
  due_date timestamp
  status task_status [default: "PENDING"]
  priority task_priority [default: "MEDIUM", not null]

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]
}

Table task_assignee {
  task_uuid uuid [ref: > TASK.uuid, not null, note: "ON DELETE CASCADE"]
  user_uuid uuid [ref: > U.uuid, note: "ON DELETE CASCADE. NULL when this row assigns to a group"]
  group_uuid uuid [ref: > G.uuid, note: "ON DELETE CASCADE. Membership is resolved on read, not snapshotted, so adding someone to the group hands them the task"]
  assigned timestamp [default: `now()`, not null]
  assigner_uuid uuid [ref: > U.uuid, note: "Who made the assignment; ON DELETE SET NULL. This is what lets a notification say who assigned you"]

  Indexes {
    (task_uuid, user_uuid) [unique, note: "PARTIAL: WHERE user_uuid IS NOT NULL"]
    (task_uuid, group_uuid) [unique, note: "PARTIAL: WHERE group_uuid IS NOT NULL"]
    (user_uuid)
    (group_uuid)
  }

  note: "Who is responsible for a task (V2.69): a user or a group, one target per row, CHECK num_nonnulls(user_uuid, group_uuid) = 1. NO primary key - a PK cannot hold nullable columns, so uniqueness is the two partial indexes above, which is also what makes assign idempotent."
}

Table notification [headercolor: #16A085] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  recipient_uuid uuid [ref: > U.uuid, not null, note: "Always a concrete user, never a group; ON DELETE CASCADE"]
  type varchar [not null, note: "CHECK: TASK_ASSIGNED, TASK_UNASSIGNED, TASK_STATUS_CHANGED, TASK_COMMENT, COMMENT_REPLY, PIPELINE_RUN_FAILED, NODE_RUN_COMPLETED (V2.83). varchar + CHECK rather than an enum because this list churns and Postgres cannot drop an enum value"]
  read boolean [default: false, not null]
  read_at timestamp [note: "NULL while unread"]
  title varchar [not null, note: "Pre-rendered at dispatch, so the inbox does not have to re-resolve deleted subjects at read time"]
  body varchar

  // Subject (whichever applies) - all ON DELETE CASCADE
  task_uuid uuid [ref: > TASK.uuid]
  comment_uuid uuid [ref: > COMMENT.uuid]
  pipeline_run_uuid uuid [ref: > pipeline_run.uuid]
  asset_uuid uuid [ref: > ASSET.uuid]

  via_group_uuid uuid [ref: > G.uuid, note: "The group through which the recipient was reached; explanatory only. ON DELETE SET NULL"]

  meta jsonb
  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, note: "The ACTOR whose action produced this, NOT the recipient. NULL for machine-generated events such as a failed run"]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid]

  Indexes {
    (recipient_uuid, created) [note: "Two indexes in the schema: this one, plus a partial WHERE read = false for the unread inbox"]
    (task_uuid)
    (comment_uuid)
    (pipeline_run_uuid)
    (asset_uuid)
  }

  note: "One durable inbox entry for one user (V2.70). A group notification is fanned out to one row per member at dispatch time - the audience is resolved when the event happens, not when the inbox is read. Nothing prunes this table automatically."
}

tablegroup Task {
  task
  task_assignee
  notification
}

//// ==========================================================================
//// Social: comment, reaction, blacklist
//// ==========================================================================

Table comment as COMMENT [headercolor: #16A085] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  title varchar
  text varchar [not null]
  parent_uuid uuid [ref: > COMMENT.uuid, note: "ON DELETE CASCADE"]

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  // Comment target (one of)
  task_uuid uuid [ref: > TASK.uuid, note: "ON DELETE CASCADE"]
  asset_uuid uuid [ref: > ASSET.uuid, note: "ON DELETE CASCADE (V2.74)"]
  annotation_uuid uuid [ref: > ANNOTATION.uuid, note: "ON DELETE CASCADE (V2.48)"]

  note: "Stores comments on tasks, annotations, assets."
}

Table reaction as REACTION [headercolor: #16A085] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  type varchar [note: "ReactionType.name(); read back with valueOf, so any other string makes every REST read of the row a 500. RATING is the workflow star rating (V2.78)"]
  rating int
  meta jsonb

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  // Reaction target (one of)
  asset_uuid uuid [ref: > ASSET.uuid, note: "ON DELETE CASCADE (V2.74)"]
  task_uuid uuid [ref: > TASK.uuid, note: "ON DELETE CASCADE"]
  comment_uuid uuid [ref: > COMMENT.uuid, note: "ON DELETE CASCADE"]
  annotation_uuid uuid [ref: > ANNOTATION.uuid, note: "ON DELETE CASCADE (V2.48)"]

  Indexes {
    (creator_uuid, type, asset_uuid) [unique, note: "One reaction of each kind per user per asset - and, since V2.78, one RATING that no longer collides with a real reaction"]
    (creator_uuid, type, comment_uuid) [unique]
    (creator_uuid, type, annotation_uuid) [unique]
    (asset_uuid, type) [note: "The filter node's read (V2.78)"]
  }

  note: "Stores social reactions on multiple elements"
}

Table blacklist as BLACKLIST [headercolor: #16A085] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  asset_uuid uuid [ref: > ASSET.uuid, not null, note: "Blacklisted asset; ON DELETE CASCADE"]

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  name varchar [note: "Human readable label for the entry (added V2.50)"]
  type varchar [note: "e.g. copyright claim"]
  review_count int [default: 1]
  meta jsonb

  Indexes {
    (asset_uuid, creator_uuid) [unique, note: "One blacklist entry per user per asset"]
  }

  note: "Blocked binaries (copyright claim, virus scanner, ...)."
}

tablegroup Social {
  comment
  reaction
  blacklist
}

//// ==========================================================================
//// Pipeline definitions, versions, runs and per-node execution ledger
//// ==========================================================================

Table pipeline [headercolor: #4B82B0] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  latest_version_uuid uuid [ref: > pipeline_version.uuid, note: "Current pipeline_version; ON DELETE SET NULL (V2.49) so the cycle with pipeline_version.pipeline_uuid does not block deletes"]
  meta jsonb

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  note: "name/description/definition/enabled/priority/dry_run moved to pipeline_version (V2.30)."
}

Table pipeline_version [headercolor: #4B82B0] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  pipeline_uuid uuid [ref: > pipeline.uuid, not null, note: "ON DELETE CASCADE"]
  version_number int [not null]
  name varchar [not null]
  description varchar
  definition jsonb [default: `'{}'`, not null]
  enabled boolean [default: true, not null]
  priority int [default: 0, not null]
  dry_run boolean [default: false, not null]
  meta jsonb

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]

  Indexes {
    (pipeline_uuid, version_number) [unique]
    (pipeline_uuid)
  }

  note: "Immutable version history of pipeline definitions"
}

Table pipeline_run [headercolor: #4B82B0] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  pipeline_uuid uuid [ref: > pipeline.uuid, note: "ON DELETE CASCADE. NULLABLE since V2.83: an ad-hoc run never belonged to a pipeline"]
  kind varchar [default: "PIPELINE", not null, note: "CHECK: PIPELINE or ADHOC (V2.83). A second CHECK pairs it with pipeline_uuid, so the impossible third state cannot be stored. An ADHOC run carries its definition in meta.definition"]
  pipeline_version int [default: 1, not null, note: "The bare version number, NOT a foreign key to pipeline_version - see DATABASE_TASKS.md Task 16"]
  started timestamp [default: `now()`, not null]
  finished timestamp
  status varchar [default: "PENDING", not null, note: "PENDING, RUNNING, SUCCESS, FAILED, PARTIAL, CANCELLED"]
  media_count int [default: 0, not null]
  success_count int [default: 0, not null]
  failure_count int [default: 0, not null]
  skipped_count int [default: 0, not null]
  dry_run boolean [default: false, not null]
  error_message varchar
  duration_ms bigint
  meta jsonb

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  Indexes {
    (pipeline_uuid)
    (started)
    (status)
    (creator_uuid, started) [note: "Partial index WHERE kind = 'ADHOC' (V2.83) - 'my recent ad-hoc runs'"]
  }

  note: "History of pipeline executions, including ad-hoc runs that execute a definition submitted with the request rather than one from the catalog (V2.83)."
}

Table pipeline_run_item [headercolor: #4B82B0] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  run_uuid uuid [ref: > pipeline_run.uuid, not null, note: "ON DELETE CASCADE"]
  item_seq bigint [not null, note: "Discovery order; idempotent re-delivery key"]
  media_path varchar [not null]
  sha512 varchar [note: "Once a hashing node has produced one. No FK and no index to asset - the seam between run history and catalog is an unconstrained string; see DATABASE_TASKS.md Task 16"]
  size_bytes bigint [note: "-1 when unknown"]
  state varchar [default: "PENDING", not null, note: "PENDING, RUNNING, SUCCESS, FAILED, SKIPPED"]
  error_message varchar
  meta jsonb

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  Indexes {
    (run_uuid, item_seq) [unique]
    (run_uuid)
    (run_uuid, state)
    (media_path)
  }

  note: "One media item discovered by a run's source node"
}

Table pipeline_node_task [headercolor: #4B82B0] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  item_uuid uuid [ref: > pipeline_run_item.uuid, not null, note: "ON DELETE CASCADE"]
  run_uuid uuid [ref: > pipeline_run.uuid, not null, note: "Denormalised; ON DELETE CASCADE"]
  node_id varchar [not null, note: "Graph-local node id"]
  node_kind varchar [not null, note: "Routes the task to a capable worker"]
  element_seq int [default: 0, not null, note: "Which element of a fanned-out sequence this execution covers; 0 when the node runs once per item (V2.60)"]
  generation int [default: 0, not null, note: "Which attempt at this execution the row records; counts up per operator-requested re-execution at a breakpoint, so 'before' and 'after' sit side by side (V2.68)"]
  state varchar [default: "PENDING", not null, note: "PENDING, RUNNING, COMPLETED, FAILED, SKIPPED, DEAD_LETTER"]
  attempt int [default: 0, not null]
  max_attempts int [default: 1, not null]
  leased_by varchar [note: "Processor node id currently holding the task. A soft reference to cortex_instance.node_id, not a foreign key - see DATABASE_TASKS.md Task 16"]
  lease_expires_at timestamp
  started timestamp
  finished timestamp
  duration_ms bigint
  error_message varchar
  outputs jsonb [note: "Node outputs consumed by downstream nodes"]
  previews jsonb [note: "Opt-in per-run debugging previews keyed by output port id (V2.67). Run-scoped and pruned with the run - never catalogue state. NULL when the run did not ask for them"]
  meta jsonb

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  Indexes {
    (item_uuid, node_id, element_seq, generation) [unique, note: "Idempotency key, widened by V2.60 (port fan-out) and V2.68 (re-execution)"]
    (item_uuid)
    (run_uuid, state)
    (lease_expires_at) [note: "Partial index WHERE state = 'RUNNING' (lease reaper)"]
  }

  note: "One node execution against one media item. MISSING INDEX: worker dispatch asks for PENDING tasks by node_kind and no index serves it - see DATABASE_TASKS.md Task 18. Largest table in the schema; V2.60 and V2.68 both multiplied its rows per run."
}

Table cortex_instance [headercolor: #4B82B0] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  node_id varchar [unique, not null, note: "Stable worker identity"]
  name varchar
  host varchar [note: "e.g. 10.0.1.10:9090"]
  priority int [default: 0, not null, note: "Higher = preferred"]
  last_seen timestamp
  state varchar [note: "e.g. ONLINE"]
  first_registered timestamp [default: `now()`, not null]

  meta jsonb
  // Audit columns are nullable: rows are created by the machine that registers (no user)
  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid]

  note: "A registered Cortex/processor worker, keyed by its stable node_id"
}

Table cortex_instance_node_kind [headercolor: #4B82B0] {
  instance_uuid uuid [ref: > cortex_instance.uuid, not null, note: "ON DELETE CASCADE"]
  node_kind varchar [not null]
  list varchar [not null, note: "CHECK: WHITELIST or BLACKLIST"]

  Indexes {
    (instance_uuid, node_kind, list) [pk]
    (node_kind)
  }

  note: "Per-worker node-kind whitelist/blacklist entries"
}

Table node_descriptor [headercolor: #4B82B0] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  node_id varchar [unique, not null, note: "The node TYPE id (whisper, acme-nsfw). NOT the graph-instance id of asset_node_result.node_id, and NOT the worker id of cortex_instance.node_id - three different things wear this name"]
  version varchar [note: "The active contract version: the LOWEST announced by any worker offering this node"]
  descriptor jsonb [not null, note: "The full announced NodeDescriptor JSON, so rehydrating at boot needs no worker"]
  body_hash varchar [not null, note: "SHA-256 of the canonical, key-sorted contract body"]
  source varchar [not null, note: "CHECK: ANNOUNCED. BUILTIN contracts are never persisted - they are recomputed from the classpath at every boot"]
  status varchar [not null, note: "CHECK: ACTIVE, or CONFLICTED when workers announce the same version with different bodies"]
  first_seen timestamp [default: `now()`, not null]
  last_announced timestamp [default: `now()`, not null, note: "NOT liveness - availability is read from cortex_instance.last_seen through node_descriptor_instance"]
  meta jsonb

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid]

  note: "A node contract announced by a Cortex worker (V2.66), kept so the node stays authorable while no worker is online. Spec knowledge is durable, worker presence is live: rows are removed only by an explicit admin action."
}

Table node_descriptor_instance [headercolor: #4B82B0] {
  node_id varchar [not null, note: "The node TYPE id. Deliberately NOT a foreign key to node_descriptor: a worker also claims built-in node ids, whose contracts are never persisted"]
  instance_uuid uuid [ref: > cortex_instance.uuid, not null, note: "ON DELETE CASCADE"]
  version varchar
  body_hash varchar [not null]
  last_announced timestamp [default: `now()`, not null]

  Indexes {
    (node_id, instance_uuid) [pk]
    (node_id)
  }

  note: "Which worker claims which node contract, and at which version"
}

tablegroup Pipeline {
  pipeline
  pipeline_version
  pipeline_run
  pipeline_run_item
  pipeline_node_task
  cortex_instance
  cortex_instance_node_kind
  node_descriptor
  node_descriptor_instance
}

//// ==========================================================================
//// Chat / Skill (agent)
//// ==========================================================================

Table chat as CHAT [headercolor: #16A085] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  title varchar [not null]
  messages jsonb [default: `'[]'`, not null, note: "role, content, metadata, asset references. A JSON ARRAY - the only column mapped by JsonArrayConverter"]
  space_uuid uuid [ref: > PROJECT.uuid, note: "Space the chat originates from (V2.53); scopes space-level agent memory. ON DELETE SET NULL"]
  meta jsonb

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  Indexes {
    (space_uuid)
  }

  note: "LLM chat sessions with message history"
}

Table chat_session as CHAT_SESSION [headercolor: #16A085] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  chat_uuid uuid [ref: > CHAT.uuid, note: "The owning chat; ON DELETE SET NULL so a published session survives the chat"]
  name varchar [not null, note: "AI-generated on first use, user-editable"]
  description varchar [note: "AI-generated on first use, user-editable"]
  tags text[] [default: `'{}'`, not null]
  published boolean [default: false, not null, note: "Visible in the shared session library"]

  // Filesystem snapshot of the session's /session directory
  pool_uuid uuid [ref: > asset_pool.uuid, note: "ON DELETE SET NULL"]
  blob_path varchar [note: "Path of the /session tarball within the pool"]
  fs_size bigint
  fs_sha256 varchar

  meta jsonb
  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  Indexes {
    (published)
    (creator_uuid)
  }

  note: "Publishable record behind one chat (V2.52): transcript-derived name/description, tags, publish flag and a /session filesystem snapshot"
}

Table chat_session_skill {
  session_uuid uuid [ref: > CHAT_SESSION.uuid, not null, note: "ON DELETE CASCADE"]
  skill_uuid uuid [ref: > skill.uuid, not null, note: "ON DELETE CASCADE"]
  skill_version integer [not null, note: "Pins skill_version.version_number"]

  Indexes {
    (session_uuid, skill_uuid) [pk]
  }
}

Table chat_session_context_ref {
  session_uuid uuid [ref: > CHAT_SESSION.uuid, not null, note: "ON DELETE CASCADE"]
  source_session_uuid uuid [ref: > CHAT_SESSION.uuid, not null, note: "ON DELETE CASCADE"]
  include_chat_history boolean [default: false, not null]
  include_skills boolean [default: false, not null]
  include_filesystem boolean [default: false, not null]
  ordinal integer [default: 0, not null]

  Indexes {
    (session_uuid, source_session_uuid) [pk]
    (source_session_uuid)
  }

  note: "Live references from a session to other published sessions, with per-part toggles"
}

Table memory_entry [headercolor: #16A085] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  scope memory_scope [not null]
  scope_uuid uuid [not null, note: "user.uuid, group.uuid or project.uuid depending on scope; intentionally NO foreign key since it spans three tables"]
  memory_id varchar [not null, note: "Path-like id relative to the scope, e.g. projects/loom-db.md"]
  title varchar
  body text [not null, note: "Markdown body without frontmatter; the header is rendered from the columns"]
  size integer [default: 0, not null, note: "Byte length of body, denormalized so a scope quota is a single SUM()"]
  sha256 varchar [not null, note: "Digest of the rendered file; lets a session container skip unchanged files"]
  version integer [default: 1, not null]
  session_name varchar [note: "Name of the chat session that last wrote this entry"]
  chat_uuid uuid [ref: > CHAT.uuid, note: "ON DELETE SET NULL"]

  meta jsonb
  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  Indexes {
    (scope, scope_uuid, memory_id) [unique]
    (scope, scope_uuid)
  }

  note: "Agent memory bank (V2.53): scoped markdown notes addressed by a path-like id"
}

Table memory_deny_rule [headercolor: #16A085] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  name varchar [unique, not null]
  pattern varchar [not null, note: "Java regular expression matched against the note body and title"]
  message varchar [not null, note: "Returned to the agent on rejection; must explain the problem without echoing the matched text"]
  enabled boolean [default: true, not null, note: "Disabled rules are kept for reference but never matched"]

  meta jsonb
  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  Indexes {
    (name) [unique]
    (enabled)
  }

  note: "Instance-wide denylist of regular expressions that must never reach the agent memory bank (V2.54)"
}

Table skill [headercolor: #16A085] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  name varchar [not null, note: "Machine-friendly, unique per owner"]
  enabled boolean [default: true, not null]
  published boolean [default: false, not null]
  origin_skill_uuid uuid [ref: > skill.uuid, note: "Published skill this was installed from; ON DELETE SET NULL"]
  active_version_uuid uuid [ref: > skill_version.uuid, note: "Currently active version; ON DELETE SET NULL (V2.49)"]
  meta jsonb

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  Indexes {
    (creator_uuid, name) [unique]
  }

  note: "User-owned agent skills. description/content live on skill_version (V2.37)."
}

Table skill_version [headercolor: #16A085] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  skill_uuid uuid [ref: > skill.uuid, not null, note: "ON DELETE CASCADE"]
  version_number int [not null]
  description varchar [not null]
  content text [not null]
  meta jsonb

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  Indexes {
    (skill_uuid, version_number) [unique]
    (skill_uuid)
  }

  note: "Immutable snapshots of the versioned skill body"
}

tablegroup Agent {
  chat
  chat_session
  chat_session_skill
  chat_session_context_ref
