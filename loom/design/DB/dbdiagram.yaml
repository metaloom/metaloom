  project_library
  project_collection
}

//// ==========================================================================
//// Attachment
//// ==========================================================================

Table attachment_binary {
  sha512sum varchar [pk, note: "Content identity of the attachment binary"]
  size bigint [not null]

  Indexes {
    (sha512sum) [unique]
  }
}

Table attachment {
  uuid uuid [unique, default: `uuid_generate_v4()`]
  binary_sha512sum varchar [ref: > attachment_binary.sha512sum, not null]

  embedding_uuid uuid [ref: > EMBEDDING.uuid]
  asset_uuid uuid [ref: > ASSET.uuid]

  mime_type varchar [not null]
  type attachment_type [not null]
  filename varchar [not null]
  meta jsonb

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  Indexes {
    (uuid) [pk]
  }

  note: "Binary attachment (e.g. thumbnail) linked to an asset or embedding."
}

tablegroup Attachment {
  attachment
  attachment_binary
}

//// ==========================================================================
//// Annotation
//// ==========================================================================

Table annotation as ANNOTATION [headercolor: #16A085] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  type annotation_type [not null]
  asset_uuid uuid [ref: > ASSET.uuid, not null, note: "ON DELETE CASCADE"]

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  title varchar
  description varchar

  time_from int
  time_to int
  areaStartX int
  areaStartY int
  areaWidth int
  areaHeight int

  meta jsonb
  thumbnail varchar [note: "Thumbnail depicting the annotated element/area"]

  note: "Asset annotations used to create chapters/sections or to attach tasks."
}

Table annotation_task {
  annotation_uuid uuid [ref: > ANNOTATION.uuid, not null, note: "ON DELETE CASCADE"]
  task_uuid uuid [ref: > TASK.uuid, not null, note: "ON DELETE CASCADE"]

  Indexes {
    (annotation_uuid, task_uuid) [pk]
  }
}

Table annotation_asset {
  annotation_uuid uuid [ref: > ANNOTATION.uuid, not null, note: "ON DELETE CASCADE"]
  asset_uuid uuid [ref: > ASSET.uuid, not null, note: "ON DELETE CASCADE"]

  Indexes {
    (annotation_uuid, asset_uuid) [pk]
  }
}

Table annotation_tag {
  annotation_uuid uuid [ref: > ANNOTATION.uuid, not null, note: "ON DELETE CASCADE"]
  tag_uuid uuid [ref: > T.uuid, not null, note: "ON DELETE CASCADE"]

  Indexes {
    (annotation_uuid, tag_uuid) [pk]
  }
}

tablegroup Annotation {
  annotation
  annotation_task
  annotation_asset
  annotation_tag
}

//// ==========================================================================
//// Task
//// ==========================================================================

Table task as TASK [headercolor: #16A085] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  title varchar [not null]
  content varchar [note: "Description of the task"]
  due_date timestamp
  status task_status [default: "PENDING"]
  priority task_priority [default: "MEDIUM", not null]

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]
}

tablegroup Task {
  task
}

//// ==========================================================================
//// Social: comment, reaction, blacklist
//// ==========================================================================

Table comment as COMMENT [headercolor: #16A085] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  title varchar
  text varchar [not null]
  parent_uuid uuid [ref: > COMMENT.uuid, note: "ON DELETE CASCADE"]

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  // Comment target (one of)
  task_uuid uuid [ref: > TASK.uuid, note: "ON DELETE CASCADE"]
  asset_uuid uuid [ref: > ASSET.uuid]
  annotation_uuid uuid [ref: > ANNOTATION.uuid]

  note: "Stores comments on tasks, annotations, assets."
}

Table reaction as REACTION [headercolor: #16A085] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  type varchar [note: "e.g. thumbsup"]
  rating int
  meta jsonb

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  // Reaction target (one of)
  asset_uuid uuid [ref: > ASSET.uuid]
  task_uuid uuid [ref: > TASK.uuid, note: "ON DELETE CASCADE"]
  comment_uuid uuid [ref: > COMMENT.uuid, note: "ON DELETE CASCADE"]
  annotation_uuid uuid [ref: > ANNOTATION.uuid]

  Indexes {
    (creator_uuid, type, asset_uuid) [unique]
    (creator_uuid, type, comment_uuid) [unique]
    (creator_uuid, type, annotation_uuid) [unique]
  }

  note: "Stores social reactions on multiple elements"
}

Table blacklist as BLACKLIST [headercolor: #16A085] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  asset_uuid uuid [ref: > ASSET.uuid, not null, note: "Blacklisted asset; ON DELETE CASCADE"]

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  type varchar [note: "e.g. copyright claim"]
  review_count int [default: 1]
  meta jsonb

  Indexes {
    (asset_uuid, creator_uuid) [unique, note: "One blacklist entry per user per asset"]
  }

  note: "Blocked binaries (copyright claim, virus scanner, ...)."
}

tablegroup Social {
  comment
  reaction
  blacklist
}

//// ==========================================================================
//// Pipeline definitions, versions, runs and per-node execution ledger
//// ==========================================================================

Table pipeline [headercolor: #4B82B0] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  latest_version_uuid uuid [ref: > pipeline_version.uuid, note: "Current pipeline_version"]
  meta jsonb

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  note: "name/description/definition/enabled/priority/dry_run moved to pipeline_version (V2.30)."
}

Table pipeline_version [headercolor: #4B82B0] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  pipeline_uuid uuid [ref: > pipeline.uuid, not null, note: "ON DELETE CASCADE"]
  version_number int [not null]
  name varchar [not null]
  description varchar
  definition jsonb [default: `'{}'`, not null]
  enabled boolean [default: true, not null]
  priority int [default: 0, not null]
  dry_run boolean [default: false, not null]
  meta jsonb

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]

  Indexes {
    (pipeline_uuid, version_number) [unique]
    (pipeline_uuid)
  }

  note: "Immutable version history of pipeline definitions"
}

Table pipeline_run [headercolor: #4B82B0] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  pipeline_uuid uuid [ref: > pipeline.uuid, not null, note: "ON DELETE CASCADE"]
  pipeline_version int [default: 1, not null]
  started timestamp [default: `now()`, not null]
  finished timestamp
  status varchar [default: "PENDING", not null, note: "PENDING, RUNNING, SUCCESS, FAILED, PARTIAL, CANCELLED"]
  media_count int [default: 0, not null]
  success_count int [default: 0, not null]
  failure_count int [default: 0, not null]
  skipped_count int [default: 0, not null]
  dry_run boolean [default: false, not null]
  error_message varchar
  duration_ms bigint
  meta jsonb

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  Indexes {
    (pipeline_uuid)
    (started)
    (status)
  }

  note: "History of pipeline executions"
}

Table pipeline_run_item [headercolor: #4B82B0] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  run_uuid uuid [ref: > pipeline_run.uuid, not null, note: "ON DELETE CASCADE"]
  item_seq bigint [not null, note: "Discovery order; idempotent re-delivery key"]
  media_path varchar [not null]
  sha512 varchar [note: "Once a hashing node has produced one"]
  size_bytes bigint [note: "-1 when unknown"]
  state varchar [default: "PENDING", not null, note: "PENDING, RUNNING, SUCCESS, FAILED, SKIPPED"]
  error_message varchar
  meta jsonb

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  Indexes {
    (run_uuid, item_seq) [unique]
    (run_uuid)
    (run_uuid, state)
    (media_path)
  }

  note: "One media item discovered by a run's source node"
}

Table pipeline_node_task [headercolor: #4B82B0] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  item_uuid uuid [ref: > pipeline_run_item.uuid, not null, note: "ON DELETE CASCADE"]
  run_uuid uuid [ref: > pipeline_run.uuid, not null, note: "Denormalised; ON DELETE CASCADE"]
  node_id varchar [not null, note: "Graph-local node id"]
  node_kind varchar [not null, note: "Routes the task to a capable worker"]
  state varchar [default: "PENDING", not null, note: "PENDING, RUNNING, COMPLETED, FAILED, SKIPPED, DEAD_LETTER"]
  attempt int [default: 0, not null]
  max_attempts int [default: 1, not null]
  leased_by varchar [note: "Processor node id currently holding the task"]
  lease_expires_at timestamp
  started timestamp
  finished timestamp
  duration_ms bigint
  error_message varchar
  outputs jsonb [note: "Node outputs consumed by downstream nodes"]
  meta jsonb

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  Indexes {
    (item_uuid, node_id) [unique, note: "Idempotency key: a node runs at most once per item"]
    (item_uuid)
    (run_uuid, state)
    (lease_expires_at) [note: "Partial index WHERE state = 'RUNNING' (lease reaper)"]
  }

  note: "One node execution against one media item"
}

Table cortex_instance [headercolor: #4B82B0] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  node_id varchar [unique, not null, note: "Stable worker identity"]
  name varchar
  host varchar [note: "e.g. 10.0.1.10:9090"]
  priority int [default: 0, not null, note: "Higher = preferred"]
  last_seen timestamp
  state varchar [note: "e.g. ONLINE"]
  first_registered timestamp [default: `now()`, not null]

  meta jsonb
  // Audit columns are nullable: rows are created by the machine that registers (no user)
  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid]

  note: "A registered Cortex/processor worker, keyed by its stable node_id"
}

Table cortex_instance_node_kind [headercolor: #4B82B0] {
  instance_uuid uuid [ref: > cortex_instance.uuid, not null, note: "ON DELETE CASCADE"]
  node_kind varchar [not null]
  list varchar [not null, note: "CHECK: WHITELIST or BLACKLIST"]

  Indexes {
    (instance_uuid, node_kind, list) [pk]
    (node_kind)
  }

  note: "Per-worker node-kind whitelist/blacklist entries"
}

tablegroup Pipeline {
  pipeline
  pipeline_version
  pipeline_run
  pipeline_run_item
  pipeline_node_task
  cortex_instance
  cortex_instance_node_kind
}

//// ==========================================================================
//// Chat / Skill (agent)
//// ==========================================================================

Table chat [headercolor: #16A085] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  title varchar [not null]
  messages jsonb [default: `'[]'`, not null, note: "role, content, metadata, asset references"]
  meta jsonb

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  note: "LLM chat sessions with message history"
}

Table skill [headercolor: #16A085] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  name varchar [not null, note: "Machine-friendly, unique per owner"]
  enabled boolean [default: true, not null]
  published boolean [default: false, not null]
  origin_skill_uuid uuid [ref: > skill.uuid, note: "Published skill this was installed from; ON DELETE SET NULL"]
  active_version_uuid uuid [ref: > skill_version.uuid, note: "Currently active version"]
  meta jsonb

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  Indexes {
    (creator_uuid, name) [unique]
  }

  note: "User-owned agent skills. description/content live on skill_version (V2.37)."
}

Table skill_version [headercolor: #16A085] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  skill_uuid uuid [ref: > skill.uuid, not null, note: "ON DELETE CASCADE"]
  version_number int [not null]
  description varchar [not null]
  content text [not null]
  meta jsonb

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  Indexes {
    (skill_uuid, version_number) [unique]
    (skill_uuid)
  }

  note: "Immutable snapshots of the versioned skill body"
}

tablegroup Agent {
  chat
  skill
  skill_version
}

//// ==========================================================================
//// Config / connectivity / misc
//// ==========================================================================

Table vector_config {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  name varchar [unique, not null]
  weights jsonb [note: "Weights per component to include in a generated vector index"]

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  note: "Custom vector index definitions used to build indices in an external vector database."
}

Table webhook as W [headercolor: #16a085] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  url varchar [not null]
  status varchar
  active boolean [default: true, not null]
  triggers loom_events [note: "Trigger which invokes the webhook"]
  secretToken varchar
  meta jsonb

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  note: "Registered webhooks"
}

Table loom as LOOM [headercolor: #4B82B0] {
  db_rev varchar
  last_used_timestamp timestamp [default: `now()`, not null]

  note: "Singleton bookkeeping row (no primary key)."
}

tablegroup Config {
  vector_config
  webhook
  loom
}

