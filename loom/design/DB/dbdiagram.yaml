  parent_collection_uuid uuid [ref: > COLLECTION.uuid]

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  note: "Collections group assets together (e.g. a project folder)."
}

Table collection_asset {
  collection_uuid uuid [ref: > COLLECTION.uuid, not null, note: "ON DELETE CASCADE (V2.80) - V2.8 created it as a plain reference, so deleting a non-empty collection failed with an FK violation"]
  asset_uuid uuid [ref: > ASSET.uuid, not null, note: "ON DELETE CASCADE (V2.73)"]

  Indexes {
    (collection_uuid, asset_uuid) [pk]
    (collection_uuid)
    (asset_uuid)
  }
}

Table library as LIB [headercolor: #16a085] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  name varchar [not null]
  meta jsonb
  description varchar
  pool_uuid uuid [ref: > asset_pool.uuid, note: "Storage pool for uploads (V2.63); ON DELETE RESTRICT. NULL = legacy local upload dir"]

  created timestamp [default: `now()`, not null]
