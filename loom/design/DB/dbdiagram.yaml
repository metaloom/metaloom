}

//// ==========================================================================
//// Search index (V2.58/V2.59)
////
//// Maintained by TRIGGERS on the source tables, not by the DAO layer:
//// storeBatch() uses ctx().batchInsert and bypasses per-element hooks, so a
//// callback-maintained index would miss every batched write.
//// ==========================================================================

Table search_document [headercolor: #7C4BB0] {
  entity_type varchar [not null, note: "asset, tag, collection, ... - part of the key, so one row per searchable entity"]
  entity_uuid uuid [not null]
  asset_uuid uuid [ref: > ASSET.uuid, note: "ON DELETE CASCADE - how an asset delete removes its search rows"]

  title text [default: "", not null, note: "tsvector weight A"]
  subtitle text [default: "", not null, note: "weight B"]
  body text [default: "", not null, note: "weight C"]
  keywords text [default: "", not null, note: "weight D"]
  body_truncated boolean [default: false, not null, note: "Body was cut at the cap. A tsvector is limited to 1MB and lexeme positions to 16383, so a book-sized Tika extraction must be truncated or the write fails"]

  lang varchar [default: "", not null]
  mime_type varchar
  size bigint
  time_from bigint
  sort_date timestamp

  library_uuids uuid[] [default: `'{}'`, not null, note: "Reserved ACL projection - populated, read by nothing until row-level ACL lands"]
  space_uuids uuid[] [default: `'{}'`, not null]
  collection_uuids uuid[] [default: `'{}'`, not null]
  tag_names text[] [default: `'{}'`, not null]

  text_search tsvector [note: "GENERATED ALWAYS AS setweight(to_tsvector('simple', ...)) STORED. Excluded from jOOQ codegen - never write it"]
  text_search_en tsvector [note: "Same, with the english (stemmed) configuration"]
  trgm_text text [note: "GENERATED, bounded trigram source over title+subtitle. Backs typo tolerance and typeahead"]

  // Outbox for an external index
  index_version int [default: 1, not null]
  synced_at timestamp [default: `now()`, not null]
  dirty boolean [default: true, not null, note: "Unused by the Postgres provider, which queries this table directly"]
  es_synced_at timestamp
  error text

  Indexes {
    (entity_type, entity_uuid) [pk]
    (text_search) [type: gin]
    (text_search_en) [type: gin]
    (trgm_text) [type: gin, note: "gin_trgm_ops"]
    (asset_uuid)
    (entity_type)
    (mime_type)
    (sort_date)
    (library_uuids) [type: gin]
    (space_uuids) [type: gin]
    (collection_uuids) [type: gin]
    (tag_names) [type: gin]
    (synced_at) [note: "Partial index WHERE dirty"]
  }

  note: "Materialized search index, one row per searchable entity. search_extract_json_text is a WHITELIST of asset_json_comp schema_types (V2.58, extended by V2.65): a JSON component nobody added a branch for is stored and silently unfindable."
}

Table search_document_deleted [headercolor: #7C4BB0] {
  entity_type varchar [not null]
  entity_uuid uuid [not null]
  deleted_at timestamp [default: `now()`, not null]

  Indexes {
    (entity_type, entity_uuid) [pk]
    (deleted_at)
  }

  note: "Delete tombstones for external index sync. Drained and pruned by the indexer; unused by the Postgres provider, which never drains it."
}

tablegroup Search {
  search_document
  search_document_deleted
}

