  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  note: "Custom vector index definitions used to build indices in an external vector database."
}

Table loom as LOOM [headercolor: #4B82B0] {
  db_rev varchar
  last_used_timestamp timestamp [default: `now()`, not null]

  note: "Singleton bookkeeping row (no primary key)."
}

tablegroup Config {
  vector_config
  loom
}

