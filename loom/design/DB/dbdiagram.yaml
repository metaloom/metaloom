//// ==========================================================================
//// Enums
//// ==========================================================================

Enum task_status {
  PENDING
  REJECTED
  ACCEPTED
  REVIEW
}

Enum task_priority {
  LOW
  MEDIUM
  HIGH
  CRITICAL
}

Enum annotation_type {
  FEEDBACK
  TAG
  CHAPTER
}

Enum attachment_type {
  ASSET_THUMBNAIL
  EMBEDDING_ATTACHMENT

  // Added V2.44 for node-produced derived binaries
  CONTACT_SHEET
  POSTER_FRAME
  WAVEFORM
  PROXY
  EXTRACTED_AUDIO

  // Added V2.79
  FACE_CROP
}

// The shared review vocabulary: a node proposes, a human decides.
// Created as cluster_status by V2.79 and renamed by V2.81, which is catalog-only
// and transactional - unlike ALTER TYPE ... ADD VALUE. Used by cluster.status
// and detection.status. Do not create a second, structurally identical enum.
Enum review_status {
  PENDING
  CONFIRMED
  REJECTED
}

// The one pre-existing duplicate of review_status (V2.61). Left alone
// deliberately: dedup_group is shipped and folding it in would rewrite the table.
Enum dedup_status {
  PENDING
  CONFIRMED
  REJECTED
}

Enum memory_scope {
  USER
  GROUP
  SPACE
}

Enum loom_permission {
  // Annotation
  CREATE_ANNOTATION
  READ_ANNOTATION
  DELETE_ANNOTATION
  UPDATE_ANNOTATION

