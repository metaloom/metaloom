Project LOOM {
  Note: '''
    # MetaLoom - Loom 1.0 Database model

    Reflects the schema produced by the Flyway migrations
    (loom/db/flyway/.../db/migration) up to and including V2.84.
    Regenerate this file from the migrations when the schema changes;
    do not hand-edit it to describe a design that is not yet migrated.

    Asset result model (V2.38-V2.47), see spec/tasks/DATABASE_TASKS.md:
      - typed component tables carry the shared component contract:
        node_kind / node_id / producer_version / run_uuid / task_uuid /
        confidence, plus UNIQUE (asset_uuid, node_kind, <discriminators>).
        A node that runs again replaces its own row instead of appending.
        Since V2.71/V2.79 tag_asset and cluster carry the same block.
      - asset_json_comp is the generic sink for results with no query
        requirement.
      - asset_node_result is the node-agnostic per-asset processing ledger.

    Review model (V2.61 dedup_group, V2.79 cluster, V2.81 detection), see
    spec/tasks/DATABASE_TASKS.md section 3.1: a node proposes with
    status PENDING, a human confirms or rejects, and the verdict survives the
    next run of the node that proposed it. review_status is the shared enum;
    dedup_status is the one pre-existing duplicate, left alone deliberately.

    Search (V2.58/V2.59): search_document is a materialized index maintained by
    triggers on the source tables, NOT by the DAO layer - storeBatch() bypasses
    per-element hooks, which is why the triggers exist.

    Vector search (V2.75): Postgres is the system of record for embeddings and
    an external ANN index is fed from it through dirty/synced_at/index_version.
    There is no pgvector extension and no ANN index in this schema.
  '''
}

//// ==========================================================================
//// ACL / Identity
//// ==========================================================================

Table user as U [headercolor: #16a085] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  username varchar [unique, not null]
  firstname varchar
  lastname varchar
  email varchar
  enabled boolean [default: true, not null, note: "Flag to enable or disable the user."]
  deleted boolean [default: false, not null]
  sso boolean [default: false, not null, note: "User was created via SSO mappings"]
  password_hash varchar
  meta jsonb [note: "Custom meta properties to the element"]

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  Indexes {
    (username) [unique]
  }
}

Table token as AK [headercolor: #16A085] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  name varchar
  description varchar
  token varchar [unique, not null]

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null, note: "Owner; ON DELETE CASCADE"]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [not null]

  meta jsonb [note: "Custom meta properties to the element"]

  Indexes {
    (token) [unique]
    (creator_uuid, name) [unique]
    (creator_uuid)
  }
}

Table role as R [headercolor: #16a085] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  name varchar [unique, not null]
  meta jsonb

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  Indexes {
    (name) [unique]
  }
}

Table role_permission [headercolor: #24BAB1] {
  role_uuid uuid [ref: > R.uuid, note: "ON DELETE CASCADE"]
  permission loom_permission [not null, note: "Permission granted by the role"]

  Indexes {
    (role_uuid, permission) [pk]
  }

  note: "V2.64 dropped the 'resource' column and the (role_uuid, resource, permission) unique index the narrower primary key made unreachable. Permissions are global: READ_ASSET means read every asset."
}

Table user_permission [headercolor: #24BAB1] {
  user_uuid uuid [ref: > U.uuid, note: "ON DELETE CASCADE"]
  resource varchar [not null]
  permission loom_permission [not null]

  Indexes {
    (user_uuid) [pk, note: "DEFECT: one direct-grant row per user, ever - a second INSERT is a PK violation, not an added permission. Grant test perms via group+role"]
    (user_uuid, resource, permission) [unique, note: "Unreachable behind the narrower PK"]
  }

  note: "V2.64 fixed the same defect on role_permission and deliberately left this table and token_permission alone; see DATABASE_TASKS.md Task 15."
}

Table token_permission [headercolor: #24BAB1] {
  token_uuid uuid [ref: > AK.uuid]
  resource varchar [not null]
  permission loom_permission [not null]

  Indexes {
    (token_uuid) [pk, note: "Same defect as user_permission: one direct grant per token, ever"]
    (token_uuid, resource, permission) [unique, note: "Unreachable behind the narrower PK"]
  }
}

Table group as G [headercolor: #16a085] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  name varchar [unique, not null]
  meta jsonb

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  Indexes {
    (name) [unique]
  }
}

Table role_group as RG {
  group_uuid uuid [ref: > G.uuid, not null, note: "ON DELETE CASCADE"]
  role_uuid uuid [ref: > R.uuid, not null, note: "ON DELETE CASCADE"]

  Indexes {
    (group_uuid, role_uuid) [pk]
  }
}

Table user_group as UG {
  user_uuid uuid [ref: > U.uuid, not null, note: "ON DELETE CASCADE"]
  group_uuid uuid [ref: > G.uuid, not null, note: "ON DELETE CASCADE"]

  Indexes {
    (user_uuid, group_uuid) [pk]
  }
}

tablegroup ACL {
  user
  token
  role
  group
  role_permission
  user_permission
  token_permission
  role_group
  user_group
}

//// ==========================================================================
//// Tag
//// ==========================================================================

Table tag as T [headercolor: #16a085] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  name varchar [not null]
  collection varchar [not null]
  meta jsonb
  rating int [note: "Absolute or buffered/precomputed rating information"]
  color char(6)

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  Indexes {
    (name, collection) [unique]
  }

  note: "Tag on various elements. Tags are not user specific"
}

Table tag_user_meta as TUM {
  tag_uuid uuid [ref: > T.uuid, not null]
  user_uuid uuid [ref: > U.uuid, not null]
  rating int [not null, note: "Rating of the tag by the user"]
  meta jsonb

  Indexes {
    (tag_uuid, user_uuid) [pk]
  }
}

Table tag_asset {
  uuid uuid [pk, default: `uuid_generate_v4()`, note: "Surrogate PK since V2.71"]
  tag_uuid uuid [ref: > T.uuid, not null, note: "ON DELETE CASCADE (V2.72)"]
  asset_uuid uuid [ref: > ASSET.uuid, not null, note: "ON DELETE CASCADE (V2.72)"]

  // Spatial / temporal placement of the tag on the asset
  time_from int
  time_to int
  areaStartX int
  areaStartY int
  areaWidth int
  areaHeight int

  // Provenance (V2.71) - who put the tag here
  node_kind varchar [not null, default: "manual"]
  node_id varchar
  producer_version varchar [not null, default: ""]
  confidence real
  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, note: "NULL when written by a worker"]

  Indexes {
    (tag_uuid, asset_uuid, time_from, time_to, areaStartX, areaStartY) [unique, note: "UNIQUE NULLS NOT DISTINCT (V2.71) - needs PostgreSQL 15+, or an asset-level tag re-attaches on every write"]
    (asset_uuid)
    (asset_uuid, node_id)
  }

  note: "Tag <-> asset placements. V2.71 replaced PRIMARY KEY (tag_uuid, asset_uuid) - which allowed one placement per asset and defeated the region columns beside it - with a surrogate key: one tag may now sit on an asset once per face and once per timecode."
}

Table tag_collection {
  tag_uuid uuid [ref: > T.uuid, not null]
  collection_uuid uuid [ref: > COLLECTION.uuid, not null]

  Indexes {
    (tag_uuid, collection_uuid) [pk]
  }
}

Table tag_cluster {
  tag_uuid uuid [ref: > T.uuid, not null]
  cluster_uuid uuid [ref: > CLUSTER.uuid, not null, note: "ON DELETE CASCADE (V2.79)"]

  Indexes {
    (tag_uuid, cluster_uuid) [pk]
  }
}

tablegroup Tagging {
  tag
  tag_user_meta
  tag_asset
  tag_collection
  tag_cluster
}

//// ==========================================================================
//// Asset (content-addressed) + storage locations + pools
//// ==========================================================================

Table asset as ASSET [headercolor: #16a085] {
  uuid uuid [pk, default: `uuid_generate_v4()`, note: "Primary key since V2.46; every child table references it"]
  sha512sum varchar [unique, not null, note: "Content identity / natural key"]
  size bigint [not null]

  // Hashes are computed incrementally by Cortex nodes -> nullable
  sha256sum varchar
  md5sum varchar
  chunk_hash varchar
  zero_chunk_count bigint
  is_complete boolean [note: "ConsistencyNode verdict; NULL = not yet checked"]

  mime_type varchar [not null]
  filename varchar [not null]
  initial_origin varchar [not null, note: "First filepath / s3 path / url / hash encountered"]
  first_seen timestamp [default: `now()`, not null]
  meta jsonb

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  note: '''
    Binary/content component of the asset.
    IDENTITY RULE (V2.46): sha512sum stays NOT NULL, so no asset row exists before a
    hashing node has run. Nodes upstream of hashing hold their outputs in
    pipeline_node_task.outputs until identity exists.
    PLACEMENT RULE: intrinsic properties of the bytes (hashes, size, zero_chunk_count,
    is_complete) live here; everything derived by interpretation lives in a component
    table keyed by its producing node.
  '''
}

Table asset_location as ASSET_LOC [headercolor: #16a085] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  asset_uuid uuid [ref: > ASSET.uuid, not null, note: "ON DELETE CASCADE. NOT unique - several locations may share one asset (V2.48)"]
  library_uuid uuid [ref: > LIB.uuid, not null, note: "ON DELETE CASCADE"]
  pool_uuid uuid [ref: > asset_pool.uuid, note: "Storage pool holding the binary"]

  path varchar [not null, note: "Currently known path in the filesystem"]

  // Filekey used by the filesystem scanner to identify the file
  // OPEN DEFECT: all four are int while ino_t is 64-bit and the Java model is Long
  // (DB_SCHEMA_FEEDBACK.md 2.4 / DATABASE_TASKS.md Task 17)
  filekey_inode int
  filekey_stdev int
  filekey_edate_nano int
  filekey_edate int

  meta jsonb
  mime_type varchar
  license varchar
  state varchar
  locked_by_uuid uuid [ref: > U.uuid]

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  Indexes {
    (path)
    (library_uuid, path) [unique, note: "The natural key (V2.48)"]
    (pool_uuid, path) [note: "Added V2.63"]
  }

  note: "Media found by the scanner. Several locations may share one asset - the same content can live at several paths and in several libraries. V2.20 had constrained this to one row per asset, which contradicted the table's purpose; V2.48 replaced that with the (library_uuid, path) key."
}

Table asset_pool [headercolor: #16a085] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  name varchar [unique, not null]
  meta jsonb

  // Filesystem pool (NULL when S3 pool) — CHECK enforces exactly one of fs_path / s3_bucket
  fs_path varchar

  // S3 pool (NULL when filesystem pool)
  s3_bucket varchar
  s3_region varchar
  s3_endpoint varchar

  free_space bigint
  used_space bigint

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  Indexes {
    (name) [unique]
  }

  note: "Storage pool for asset binaries: either a filesystem directory or an S3 bucket."
}

Table asset_remix {
  asset_a_uuid uuid [ref: > ASSET.uuid, not null, note: "ON DELETE CASCADE"]
  asset_b_uuid uuid [ref: > ASSET.uuid, not null, note: "ON DELETE CASCADE"]
  meta jsonb
  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [not null]

  Indexes {
    (asset_a_uuid)
    (asset_b_uuid)
  }

  note: "Store information on remixes of binaries."
}

Table asset_user_meta as AUM [headercolor: #16A085] {
  asset_uuid uuid [ref: > ASSET.uuid, not null, note: "ON DELETE CASCADE (V2.73)"]
  user_uuid uuid [ref: > U.uuid, not null]
  meta jsonb [note: "Custom meta properties"]

  Indexes {
    (asset_uuid, user_uuid) [pk]
  }

  note: "User specific metadata added to assets"
}

Table asset_task {
  asset_uuid uuid [ref: > ASSET.uuid, not null, note: "ON DELETE CASCADE (V2.73)"]
  task_uuid uuid [ref: > TASK.uuid, not null, note: "ON DELETE CASCADE"]

  Indexes {
    (asset_uuid, task_uuid) [pk]
  }
}

tablegroup Assets {
  asset
  asset_location
  asset_pool
  asset_remix
  asset_user_meta
  asset_task
}

//// ==========================================================================
//// Asset components (typed node results; 1:N per asset)
////
//// Shared component contract (V2.38+) - every asset_*_comp table has:
////   uuid pk, asset_uuid (ON DELETE CASCADE),
////   node_kind not null, node_id, producer_version not null default '',
////   run_uuid -> pipeline_run (SET NULL), task_uuid -> pipeline_node_task (SET NULL),
////   confidence, meta,
////   created/creator_uuid/edited/editor_uuid  (creator/editor NULLABLE: machine-written),
////   UNIQUE (asset_uuid, node_kind, <typed discriminators>)
////
//// producer_version is NOT in the key: a re-run replaces the row and rewrites the
//// version, and WHERE node_kind = ? AND producer_version <> ? finds stale results.
//// ==========================================================================

Table asset_geo_comp {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  asset_uuid uuid [ref: > ASSET.uuid, not null, note: "ON DELETE CASCADE"]

  node_kind varchar [not null, note: "Producing node kind, e.g. tika, llm, manual"]
  node_id varchar
  producer_version varchar [not null, default: "", note: "Model/algorithm version"]
  run_uuid uuid [ref: > pipeline_run.uuid, note: "ON DELETE SET NULL"]
  task_uuid uuid [ref: > pipeline_node_task.uuid, note: "ON DELETE SET NULL"]
  confidence real

  method varchar [not null, default: "", note: "exif | xmp | gps-track | llm | manual"]
  time_from bigint [not null, default: 0, note: "ms offset; 0 for stills"]
  geo_lon decimal(9,6)
  geo_lat decimal(8,6)
  geo_alias varchar
  accuracy_m real

  meta jsonb
  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, note: "NULL when written by a worker"]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid]

  Indexes {
    (asset_uuid, node_kind, method, time_from) [unique]
    (asset_uuid)
    (geo_lon, geo_lat)
  }

  note: "A drone video carries a whole GPS track: one row per time offset."
}

Table asset_doc_comp {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  asset_uuid uuid [ref: > ASSET.uuid, not null, note: "ON DELETE CASCADE"]

  node_kind varchar [not null]
  node_id varchar
  producer_version varchar [not null, default: ""]
  run_uuid uuid [ref: > pipeline_run.uuid]
  task_uuid uuid [ref: > pipeline_node_task.uuid]
  confidence real

  page_number int [not null, default: 0, note: "0 = whole document"]
  page_count int
  text_lang varchar
  doc_plain_text text [note: "Extracted text of the document"]
  doc_word_count int
  text_search tsvector [note: "GENERATED ALWAYS AS to_tsvector('simple', doc_plain_text) STORED; GIN indexed"]

  meta jsonb
  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid]

  Indexes {
    (asset_uuid, node_kind, page_number) [unique]
    (asset_uuid)
    (text_search) [type: gin]
  }

  note: "Tika writes the whole document as page 0; OCR writes one row per page."
}

Table asset_image_comp {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  asset_uuid uuid [ref: > ASSET.uuid, not null, note: "ON DELETE CASCADE"]

  node_kind varchar [not null]
  node_id varchar
  producer_version varchar [not null, default: ""]
  run_uuid uuid [ref: > pipeline_run.uuid]
  task_uuid uuid [ref: > pipeline_node_task.uuid]
  confidence real

  stream_index int [not null, default: 0, note: "Multi-frame TIFF/GIF, embedded cover art"]
  image_dominant_color varchar
  image_encoding varchar
  media_width int
  media_height int
  orientation int
  bit_depth int
  blurriness real [note: "Quality node"]

  meta jsonb
  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid]

  Indexes {
    (asset_uuid, node_kind, stream_index) [unique]
    (asset_uuid)
  }

  note: "Never gated on the asset mime type: an MP3 with cover art owns an image component."
}

Table asset_video_comp {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  asset_uuid uuid [ref: > ASSET.uuid, not null, note: "ON DELETE CASCADE"]

  node_kind varchar [not null]
  node_id varchar
  producer_version varchar [not null, default: ""]
  run_uuid uuid [ref: > pipeline_run.uuid]
  task_uuid uuid [ref: > pipeline_node_task.uuid]
  confidence real

  stream_index int [not null, default: 0]
  media_width int
  media_height int
  media_duration bigint [note: "ms"]
  video_bitrate int
  video_encoding varchar
  fps real [note: "Quality node"]
  frame_count bigint [note: "Quality node"]
  rotation int
  blurriness real

  meta jsonb
  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid]

  Indexes {
    (asset_uuid, node_kind, stream_index) [unique]
    (asset_uuid)
  }

  note: "Two producers of the same dimension yield two partially filled rows; the read side coalesces by producer precedence."
}

Table asset_audio_comp as AUDIO_COMP {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  asset_uuid uuid [ref: > ASSET.uuid, not null, note: "ON DELETE CASCADE"]

  node_kind varchar [not null]
  node_id varchar
  producer_version varchar [not null, default: ""]
  run_uuid uuid [ref: > pipeline_run.uuid]
  task_uuid uuid [ref: > pipeline_node_task.uuid]
  confidence real

  stream_index int [not null, default: 0, note: "Which audio track"]
  lang varchar
  track_title varchar
  is_default boolean
  audio_bpm int
  audio_sampling_rate int
  audio_channels int
  audio_bitrate int
  audio_encoding varchar [note: "e.g. mp3, flac"]
  media_duration bigint [note: "ms"]

  meta jsonb
  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid]

  Indexes {
    (asset_uuid, node_kind, stream_index) [unique]
    (asset_uuid)
  }

  note: "A video with a German and an English track has two rows."
}

Table asset_transcript_comp {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  asset_uuid uuid [ref: > ASSET.uuid, not null, note: "ON DELETE CASCADE"]

  node_kind varchar [not null]
  node_id varchar
  producer_version varchar [not null, default: ""]
  run_uuid uuid [ref: > pipeline_run.uuid]
  task_uuid uuid [ref: > pipeline_node_task.uuid]
  confidence real

  stream_index int [not null, default: 0, note: "Which audio track was transcribed"]
  lang varchar [not null, default: "", note: "BCP-47; '' = undetermined"]
  audio_comp_uuid uuid [ref: > AUDIO_COMP.uuid, note: "ON DELETE SET NULL - a replaced track must not delete the transcript"]
  model varchar [note: "Readable mirror of producer_version"]
  transcript_text text [note: "Full concatenated transcript"]
  duration bigint [note: "ms"]
  word_count int
  transcript_json jsonb [note: "Sections/words with timings; consumed by the UI"]
  text_search tsvector [note: "GENERATED ... STORED; GIN indexed"]

  meta jsonb
  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid]

  Indexes {
    (asset_uuid, node_kind, stream_index, lang) [unique]
    (asset_uuid)
    (lang)
    (audio_comp_uuid)
    (text_search) [type: gin]
  }

  note: "stream_index is in the key rather than the FK: an audio-only asset may be transcribed before any audio component exists."
}

Table asset_fingerprint_comp {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  asset_uuid uuid [ref: > ASSET.uuid, not null, note: "ON DELETE CASCADE"]

  node_kind varchar [not null]
  node_id varchar
  producer_version varchar [not null, default: ""]
  run_uuid uuid [ref: > pipeline_run.uuid]
  task_uuid uuid [ref: > pipeline_node_task.uuid]
  confidence real

  algorithm varchar [not null, note: "e.g. metaloom-multisector-v1"]
  sector_index int [not null, default: 0]
  time_from bigint [note: "ms"]
  time_to bigint [note: "ms"]
  fingerprint varchar [not null]

  meta jsonb
  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid]

  Indexes {
    (asset_uuid, node_kind, algorithm, sector_index) [unique]
    (asset_uuid)
    (algorithm, fingerprint) [note: "The dedup lookup"]
  }

  note: "Perceptual fingerprints, one row per sector. Added V2.41 so FingerprintDedupNode has a queryable home."
}

Table asset_segment_comp {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  asset_uuid uuid [ref: > ASSET.uuid, not null, note: "ON DELETE CASCADE"]

  node_kind varchar [not null]
  node_id varchar
  producer_version varchar [not null, default: ""]
  run_uuid uuid [ref: > pipeline_run.uuid]
  task_uuid uuid [ref: > pipeline_node_task.uuid]
  confidence real

  segment_type varchar [not null, note: "CHECK: SCENE | SILENCE | SHOT | CHAPTER"]
  seq int [not null, note: "Ordinal within (asset, node_kind, segment_type)"]
  time_from bigint [not null, note: "ms"]
  time_to bigint [not null, note: "ms; CHECK time_to >= time_from"]
  title varchar
  score real

  meta jsonb
  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid]

  Indexes {
    (asset_uuid, node_kind, segment_type, seq) [unique]
    (asset_uuid)
    (asset_uuid, segment_type, time_from)
  }

  note: "Scenes, silence, shots, chapters. Replace-in-place is at the SET level: a re-run writes seq 0..N-1 and deletes seq >= N."
}

Table asset_json_comp {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  asset_uuid uuid [ref: > ASSET.uuid, not null, note: "ON DELETE CASCADE"]

  node_kind varchar [not null, note: "Producing node kind, e.g. llm, captioning"]
  node_id varchar
  producer_version varchar [not null, default: ""]
  run_uuid uuid [ref: > pipeline_run.uuid]
  task_uuid uuid [ref: > pipeline_node_task.uuid]
  confidence real

  schema_type varchar [not null, note: "Shape label, e.g. yolo-detection, caption, llm-answer"]
  variant varchar [not null, default: "", note: "Prompt id, model tag - what makes two results of one node distinct"]
  data jsonb [not null, default: `'{}'`]

  meta jsonb
  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid]

  Indexes {
    (asset_uuid, node_kind, schema_type, variant) [unique]
    (asset_uuid)
    (schema_type)
    (data) [type: gin]
  }

  note: "Generic sink for node results with no query requirement. A node kind graduates to a typed table when a query must filter inside data, when the UI renders it as a first-class object, or when it needs a foreign key."
}

Table asset_node_result {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  asset_uuid uuid [ref: > ASSET.uuid, not null, note: "ON DELETE CASCADE"]

  node_kind varchar [not null]
  node_id varchar [not null, default: "", note: "'' when the node ran outside a pipeline"]
  producer_version varchar [not null, default: ""]

  state varchar [not null, note: "CHECK: SUCCESS | SKIPPED | FAILED (ResultState)"]
  origin varchar [note: "CHECK: COMPUTED | LOCAL | REMOTE (ResultOrigin)"]
  reason varchar [note: "Skip reason or failure detail"]

  run_uuid uuid [ref: > pipeline_run.uuid, note: "ON DELETE SET NULL"]
  task_uuid uuid [ref: > pipeline_node_task.uuid, note: "ON DELETE SET NULL"]
  started timestamp
  finished timestamp
  duration_ms bigint

  result_ref jsonb [note: "Advisory pointer to the rows written; NOT a foreign key"]
  meta jsonb
  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid]

  Indexes {
    (asset_uuid, node_kind, node_id) [unique]
    (asset_uuid)
    (node_kind, producer_version) [note: "The invalidation sweep"]
    (run_uuid)
  }

  note: "Per-asset processing ledger: has node X at version V processed asset A, and what happened - regardless of which table the payload landed in. Permanent catalog state, unlike pipeline_node_task which is per run item and pruned with the run."
}

tablegroup AssetComponents {
  asset_geo_comp
  asset_doc_comp
  asset_image_comp
  asset_video_comp
  asset_audio_comp
  asset_transcript_comp
  asset_fingerprint_comp
  asset_segment_comp
  asset_json_comp
  asset_node_result
}

//// ==========================================================================
//// Detection / Embedding / Cluster
//// ==========================================================================

Table detection as DETECTION [headercolor: #16A085] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  asset_uuid uuid [ref: > ASSET.uuid, not null, note: "ON DELETE CASCADE (V2.43; V2.27 omitted it)"]

  node_kind varchar [not null, note: "e.g. facedetect, manual"]
  node_id varchar
  producer_version varchar [not null, default: ""]
  run_uuid uuid [ref: > pipeline_run.uuid, note: "ON DELETE SET NULL"]
  task_uuid uuid [ref: > pipeline_node_task.uuid, note: "ON DELETE SET NULL"]

  type varchar [not null, note: "e.g. facedetection, objectdetection"]
  label varchar [note: "Detected class for object detection; promoted out of meta so it can be indexed"]
  frame_number int [default: 0, not null, note: "0 for images"]
  detection_index int [default: 0, not null, note: "Ordinal within the frame"]
  time_from bigint [note: "ms offset of the frame, for video"]

  // Bounding box, normalized 0-1 - the single geometry convention
  bbox_x real [default: 0, not null]
  bbox_y real [default: 0, not null]
  bbox_width real [default: 0, not null]
  bbox_height real [default: 0, not null]

  confidence real [default: 0, not null]
  meta jsonb [note: "e.g. gender, age, face angle"]

  // Review state (V2.79/V2.81) - the human verdict on a machine proposal
  status review_status [default: "PENDING", not null, note: "Reset to PENDING by an upsert whose producer_version differs from the stored one"]
  reviewed_at timestamp
  reviewer_uuid uuid [ref: > U.uuid, note: "Who decided; may differ from editor_uuid"]
  corrected_label varchar [note: "Human correction of 'label' - the detection is right, the class is wrong"]

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, note: "NULL when written by a worker"]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid]

  Indexes {
    (asset_uuid, node_kind, frame_number, detection_index) [unique]
    (asset_uuid)
    (type)
    (label)
    (asset_uuid, type, status) [note: "The per-asset review queue (V2.81)"]
    (status, type) [note: "The cross-asset review queue - it cannot use the index above (V2.81)"]
  }

  note: "Object and face detections within assets. Keyed so a re-run replaces rather than duplicating a whole frame's worth of detections - but DetectionDaoImpl.upsertDetection excludes status/reviewed_at/reviewer_uuid/corrected_label from the DO UPDATE set, so a re-run never clears a human verdict."
}

Table embedding as EMBEDDING [headercolor: #16A085] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  asset_uuid uuid [ref: > ASSET.uuid, not null, note: "ON DELETE CASCADE"]

  node_kind varchar [not null]
  node_id varchar
  producer_version varchar [not null, default: ""]
  run_uuid uuid [ref: > pipeline_run.uuid]
  task_uuid uuid [ref: > pipeline_node_task.uuid]
  confidence real

  type varchar [not null, note: "Type of the embedding (e.g. dlib_facemark, inspireface). Free text - there is deliberately no EmbeddingType enum"]
  model varchar [not null, default: "", note: "In the unique key since V2.75, so a model upgrade adds rows beside the old ones instead of overwriting them"]
  dimensions int [not null, note: "CHECK array_length(vector,1) = dimensions (V2.75)"]
  vector real[] [not null, note: "Plain PG array. ANN lives OUTSIDE Postgres behind the VectorIndex SPI - no pgvector extension is involved (V2.75)"]
  normalized boolean [default: false, not null, note: "Whether the vector is L2-normalized, so a consumer need not guess"]

  // External-index exporter contract (V2.75), mirroring search_document
  dirty boolean [default: true, not null, note: "Needs (re)indexing"]
  synced_at timestamp [default: `now()`, not null]
  index_version int [default: 1, not null]

  detection_uuid uuid [ref: > DETECTION.uuid, note: "The detection this vector came from; ON DELETE CASCADE. NULL for whole-image / audio-window embeddings"]
  frame_number int [default: 0, not null]
  subject_index int [default: 0, not null, note: "Ordinal within the frame when there is no detection to key on"]
  time_from bigint [note: "ms"]
  time_to bigint [note: "ms"]

  meta jsonb
  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, note: "NULL when written by a worker"]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid]

  Indexes {
    (asset_uuid, node_kind, type, model, frame_number, subject_index) [unique, note: "V2.75 added 'model': without it, re-running a node under a new embedding model upserted over the old model's vector, making a model upgrade destructive and irreversible"]
    (asset_uuid)
    (detection_uuid)
    (type, model)
    (synced_at) [note: "Partial index WHERE dirty (the exporter's queue)"]
  }

  note: "V2.43 dropped the duplicated absolute-pixel geometry (areaStartX/...) - the region lives on the linked detection, in one convention. fromTime/toTime became time_from/time_to. V2.75 made this table the system of record an external ANN index is derived from."
}

Table cluster as CLUSTER [headercolor: #16A085] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  name varchar [note: "Nullable since V2.79 - a machine proposal has no name until a human gives it one"]
  meta jsonb
  type varchar [not null, note: "e.g. person"]

  // Provenance (V2.79) - the same block every other producer table carries
  node_kind varchar
  node_id varchar
  producer_version varchar [not null, default: ""]
  run_uuid uuid [ref: > pipeline_run.uuid, note: "ON DELETE SET NULL"]
  task_uuid uuid [ref: > pipeline_node_task.uuid, note: "ON DELETE SET NULL"]

  asset_uuid uuid [ref: > ASSET.uuid, note: "The asset a per-asset cluster describes; ON DELETE CASCADE"]
  cluster_index int [default: 0, not null, note: "Ordinal within (asset, node_kind)"]

  // Review state (V2.79)
  status review_status [default: "PENDING", not null]
  person_uuid uuid [ref: > PERSON.uuid, note: "Set when a human confirms the proposal is a known person; ON DELETE SET NULL - deleting a person must not erase the review record"]

  score real
  centroid real[] [note: "Representative vector of the cluster"]
  model varchar
  dimensions int

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, note: "NULLABLE since V2.79 - V2.47 skipped this table, so a Cortex worker physically could not insert a cluster"]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid]

  Indexes {
    (type, name) [unique, note: "PARTIAL: WHERE name IS NOT NULL (V2.79). V2.12 had a global UNIQUE (name), so a person cluster and a visual-similarity cluster could not share a name"]
    (asset_uuid, node_kind, cluster_index) [unique, note: "The producer key (V2.79)"]
    (status)
    (type, status)
    (asset_uuid)
    (person_uuid)
  }

  note: "Generic cluster aggregating multiple embeddings (e.g. a person, or visually-similar media). V2.79 turned it into a machine-writable, human-reviewable identity proposal and gave it the first relation to 'person' - the two had modelled the same concept with no link between them."
}

Table embedding_cluster {
  embedding_uuid uuid [ref: > EMBEDDING.uuid, not null]
  cluster_uuid uuid [ref: > CLUSTER.uuid, not null, note: "ON DELETE CASCADE (V2.51) - a cluster with members could not be deleted at all"]
  confidence real [note: "Membership strength (V2.79)"]
  origin varchar [default: "AUTO", not null, note: "CHECK: AUTO or MANUAL - was this member clustered by a node or moved by a human"]
  created timestamp [default: `now()`, not null]

  Indexes {
    (embedding_uuid, cluster_uuid) [pk]
    (cluster_uuid)
  }
}

Table collection_cluster {
  collection_uuid uuid [ref: > COLLECTION.uuid, not null, note: "ON DELETE CASCADE"]
  cluster_uuid uuid [ref: > CLUSTER.uuid, not null, note: "ON DELETE CASCADE"]

  Indexes {
    (collection_uuid, cluster_uuid) [pk]
    (collection_uuid)
    (cluster_uuid)
  }
}

tablegroup DetectionEmbedding {
  detection
  embedding
  cluster
  embedding_cluster
  collection_cluster
}

//// ==========================================================================
//// Dedup review (V2.61)
//// ==========================================================================

Table dedup_group as DEDUP [headercolor: #B07C4B] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  algorithm varchar [not null, note: "Fingerprint algorithm the similarity was computed with, e.g. metaloom-multisector-v1"]
  status dedup_status [default: "PENDING", not null, note: "PENDING (awaiting review), CONFIRMED (the apply node may act) or REJECTED (never act)"]
  keep_asset_uuid uuid [ref: > ASSET.uuid, note: "Denormalised pointer to the KEEP member; ON DELETE SET NULL. The authoritative KEEP is the member with role = KEEP"]
  score real [note: "Representative (minimum member) similarity score"]
  meta jsonb

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, note: "NULL when machine-created by the discovery node"]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid]

  Indexes {
    (status)
  }

  note: "A candidate duplicate set (one KEEP + N DUP members) found via fingerprint similarity, awaiting or holding a human decision. The first table to carry the review model V2.79 and V2.81 later generalised."
}

Table dedup_group_member {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  group_uuid uuid [ref: > DEDUP.uuid, not null, note: "ON DELETE CASCADE"]
  asset_uuid uuid [ref: > ASSET.uuid, not null, note: "ON DELETE CASCADE"]
  role varchar [not null, note: "CHECK: KEEP (the asset to keep) or DUP (a candidate duplicate to move)"]
  score real
  size bigint [note: "File size snapshot at discovery time; apply re-verifies live"]
  zero_chunk_count bigint [note: "Completeness snapshot at discovery time; 0 means complete"]

  Indexes {
    (group_uuid, asset_uuid) [unique]
    (asset_uuid)
    (group_uuid)
  }
}

tablegroup DedupReview {
  dedup_group
  dedup_group_member
}

