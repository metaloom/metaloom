//// ==========================================================================
//// Attachment
//// ==========================================================================

Table attachment_binary {
  sha512sum varchar [pk, note: "Content identity of the attachment binary"]
  size bigint [not null]

  Indexes {
    (sha512sum) [unique]
  }
}

Table attachment {
  uuid uuid [unique, default: `uuid_generate_v4()`]
  binary_sha512sum varchar [ref: > attachment_binary.sha512sum, not null]

  embedding_uuid uuid [ref: > EMBEDDING.uuid, note: "ON DELETE CASCADE"]
  asset_uuid uuid [ref: > ASSET.uuid, note: "ON DELETE CASCADE (V2.44)"]

  mime_type varchar [not null]
  type attachment_type [not null]
  filename varchar [not null]

  // Node provenance (V2.44) - NULL for user-uploaded attachments
  node_kind varchar
  node_id varchar
  producer_version varchar [not null, default: ""]
  variant varchar [not null, default: "", note: "sheet-1, t=00:10, ... within (asset, type, node_kind)"]
  run_uuid uuid [ref: > pipeline_run.uuid, note: "ON DELETE SET NULL"]
  task_uuid uuid [ref: > pipeline_node_task.uuid, note: "ON DELETE SET NULL"]

  meta jsonb

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, note: "NULL when written by a worker (V2.47)"]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid]

  Indexes {
    (uuid) [pk]
    (asset_uuid, type, node_kind, variant) [unique, note: "PARTIAL: WHERE asset_uuid IS NOT NULL AND node_kind IS NOT NULL"]
    (asset_uuid)
  }

  note: "Sink for derived binaries: thumbnails, contact sheets, poster frames, proxies. The two targets are NOT alternatives - an EMBEDDING_ATTACHMENT carries both the embedding it depicts and the asset that embedding came from, so there is deliberately no exactly-one-target constraint."
}

tablegroup Attachment {
