  priority int [default: 0, not null, note: "Higher = preferred"]
  last_seen timestamp
  state varchar [note: "e.g. ONLINE"]
  first_registered timestamp [default: `now()`, not null]

  meta jsonb
  // Audit columns are nullable: rows are created by the machine that registers (no user)
  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid]

  note: "A registered Cortex/processor worker, keyed by its stable node_id"
}

