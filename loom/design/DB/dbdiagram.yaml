  description varchar

  time_from int
  time_to int
  areaStartX int
  areaStartY int
  areaWidth int
  areaHeight int

  meta jsonb
  thumbnail varchar [note: "Thumbnail depicting the annotated element/area"]

  note: "Asset annotations used to create chapters/sections or to attach tasks."
}

Table annotation_task {
  annotation_uuid uuid [ref: > ANNOTATION.uuid, not null, note: "ON DELETE CASCADE"]
  task_uuid uuid [ref: > TASK.uuid, not null, note: "ON DELETE CASCADE"]

  Indexes {
    (annotation_uuid, task_uuid) [pk]
  }
}

Table annotation_asset {
  annotation_uuid uuid [ref: > ANNOTATION.uuid, not null, note: "ON DELETE CASCADE"]
  asset_uuid uuid [ref: > ASSET.uuid, not null, note: "ON DELETE CASCADE"]

  Indexes {
    (annotation_uuid, asset_uuid) [pk]
  }
}

Table annotation_tag {
  annotation_uuid uuid [ref: > ANNOTATION.uuid, not null, note: "ON DELETE CASCADE"]
