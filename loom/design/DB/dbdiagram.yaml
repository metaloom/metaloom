  meta jsonb

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  note: "name/description/definition/enabled/priority/dry_run moved to pipeline_version (V2.30)."
}

Table pipeline_version [headercolor: #4B82B0] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  pipeline_uuid uuid [ref: > pipeline.uuid, not null, note: "ON DELETE CASCADE"]
  version_number int [not null]
  name varchar [not null]
  description varchar
  definition jsonb [default: `'{}'`, not null]
  enabled boolean [default: true, not null]
  priority int [default: 0, not null]
  dry_run boolean [default: false, not null]
  meta jsonb

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]

  Indexes {
    (pipeline_uuid, version_number) [unique]
    (pipeline_uuid)
  }

  note: "Immutable version history of pipeline definitions"
}

Table pipeline_run [headercolor: #4B82B0] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  pipeline_uuid uuid [ref: > pipeline.uuid, not null, note: "ON DELETE CASCADE"]
  pipeline_version int [default: 1, not null]
  started timestamp [default: `now()`, not null]
  finished timestamp
  status varchar [default: "PENDING", not null, note: "PENDING, RUNNING, SUCCESS, FAILED, PARTIAL, CANCELLED"]
  media_count int [default: 0, not null]
  success_count int [default: 0, not null]
  failure_count int [default: 0, not null]
  skipped_count int [default: 0, not null]
  dry_run boolean [default: false, not null]
  error_message varchar
  duration_ms bigint
  meta jsonb

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  Indexes {
    (pipeline_uuid)
    (started)
    (status)
  }

  note: "History of pipeline executions"
}

Table pipeline_run_item [headercolor: #4B82B0] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  run_uuid uuid [ref: > pipeline_run.uuid, not null, note: "ON DELETE CASCADE"]
  item_seq bigint [not null, note: "Discovery order; idempotent re-delivery key"]
  media_path varchar [not null]
  sha512 varchar [note: "Once a hashing node has produced one"]
  size_bytes bigint [note: "-1 when unknown"]
  state varchar [default: "PENDING", not null, note: "PENDING, RUNNING, SUCCESS, FAILED, SKIPPED"]
  error_message varchar
  meta jsonb

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  Indexes {
    (run_uuid, item_seq) [unique]
    (run_uuid)
    (run_uuid, state)
    (media_path)
  }

  note: "One media item discovered by a run's source node"
}

Table pipeline_node_task [headercolor: #4B82B0] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  item_uuid uuid [ref: > pipeline_run_item.uuid, not null, note: "ON DELETE CASCADE"]
  run_uuid uuid [ref: > pipeline_run.uuid, not null, note: "Denormalised; ON DELETE CASCADE"]
  node_id varchar [not null, note: "Graph-local node id"]
  node_kind varchar [not null, note: "Routes the task to a capable worker"]
  state varchar [default: "PENDING", not null, note: "PENDING, RUNNING, COMPLETED, FAILED, SKIPPED, DEAD_LETTER"]
  attempt int [default: 0, not null]
  max_attempts int [default: 1, not null]
  leased_by varchar [note: "Processor node id currently holding the task"]
  lease_expires_at timestamp
  started timestamp
  finished timestamp
  duration_ms bigint
  error_message varchar
  outputs jsonb [note: "Node outputs consumed by downstream nodes"]
  meta jsonb

  created timestamp [default: `now()`, not null]
  creator_uuid uuid [ref: > U.uuid, not null]
  edited timestamp [default: `now()`, not null]
  editor_uuid uuid [ref: > U.uuid, not null]

  Indexes {
    (item_uuid, node_id) [unique, note: "Idempotency key: a node runs at most once per item"]
    (item_uuid)
    (run_uuid, state)
    (lease_expires_at) [note: "Partial index WHERE state = 'RUNNING' (lease reaper)"]
  }

  note: "One node execution against one media item"
}

Table cortex_instance [headercolor: #4B82B0] {
  uuid uuid [pk, default: `uuid_generate_v4()`]
  node_id varchar [unique, not null, note: "Stable worker identity"]
  name varchar
