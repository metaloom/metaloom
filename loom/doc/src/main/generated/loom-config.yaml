  namespace: ""
  idleTtlSeconds: 900
  maxSessionSeconds: 3600
  execTimeoutSeconds: 120
  maxConcurrent: 10
  readyTimeoutSeconds: 60
  cpuRequest: "100m"
  cpuLimit: "1"
  memRequest: "128Mi"
  memLimit: "512Mi"
  workspaceSize: "512Mi"
memory:
  enabled: false
  mountEnabled: true
  mountPath: "/memory"
