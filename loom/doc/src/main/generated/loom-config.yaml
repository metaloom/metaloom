s3:
  endpoint: null
  region: "us-east-1"
  accessKey: null
  secretKey: null
  pathStyleAccess: null
ai:
  enabled: true
  url: "http://127.0.0.1:8080/v1"
  modelId: "openai/gpt-oss-20b"
  contextWindow: 16384
  maxTurns: 8
  toolTimeoutMs: 30000
  thinkEnabled: true
  streaming: false
  titleGeneration: true
sandbox:
  enabled: false
  backend: "podman"
