  minPoolSize: 5
  acquireIncrement: 5
  maxPoolSize: 20
server:
  grpcPort: 8091
  bindAddress: "0.0.0.0"
  restPort: 8092
  monitoringPort: 8989
  mcpPort: 4041
auth:
  keystorePassword: null
  initialPassword: null
