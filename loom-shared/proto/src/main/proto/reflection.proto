// Standard gRPC server reflection protocol (v1).
// See https://github.com/grpc/grpc/blob/master/src/proto/grpc/reflection/v1/reflection.proto
//
// The proto package must remain "grpc.reflection.v1" so that the service is
// reachable under its well known name grpc.reflection.v1.ServerReflection.
// Tooling such as grpcurl relies on this to discover the exposed services.
syntax = "proto3";

option java_multiple_files = true;
option java_package = "io.metaloom.loom.proto.reflection";
option java_outer_classname = "ServerReflectionProto";

package grpc.reflection.v1;

service ServerReflection {
  // The reflection service is bidirectional streaming: the client sends a
  // stream of lookup requests and the server answers each one in order.
  rpc ServerReflectionInfo (stream ServerReflectionRequest) returns (stream ServerReflectionResponse) {}
}

message ServerReflectionRequest {
  string host = 1;

  // To use reflection service, the client should set one of these fields.
  oneof message_request {
    // Find a proto file by the file name.
    string file_by_filename = 3;

    // Find the proto file that declares the given fully qualified symbol name.
    string file_containing_symbol = 4;

    // Find the proto file which defines an extension of the given message type.
    ExtensionRequest file_containing_extension = 5;

    // Find all known extension numbers of the given message type.
    string all_extension_numbers_of_type = 6;

    // List the full names of the registered services. The content is ignored.
    string list_services = 7;
  }
}

// The type name and extension number sent by the client when requesting
// file_containing_extension.
message ExtensionRequest {
  string containing_type = 1;
  int32 extension_number = 2;
}

message ServerReflectionResponse {
  string valid_host = 1;
  ServerReflectionRequest original_request = 2;

  // The server sets one of these fields, matching the kind of request.
  oneof message_response {
    FileDescriptorResponse file_descriptor_response = 4;
    ExtensionNumberResponse all_extension_numbers_response = 5;
    ListServiceResponse list_services_response = 6;

    // Sent when an error occurs during handling a request.
    ErrorResponse error_response = 7;
  }
}

// Serialized FileDescriptorProto messages sent by the server answering a
// file_by_filename, file_containing_symbol or file_containing_extension request.
message FileDescriptorResponse {
  repeated bytes file_descriptor_proto = 1;
}

message ExtensionNumberResponse {
  string base_type_name = 1;
  repeated int32 extension_number = 2;
}

message ListServiceResponse {
  repeated ServiceResponse service = 1;
}

message ServiceResponse {
  string name = 1;
}

message ErrorResponse {
  int32 error_code = 1;
  string error_message = 2;
}
