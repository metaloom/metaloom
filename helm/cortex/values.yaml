# Default values for the MetaLoom Cortex chart.
# This is a YAML-formatted file. Every key is documented; override what you need.

# -- Number of worker replicas. Each replica registers with Loom as its own
# worker (stable identity via the StatefulSet ordinal — see nodeId below).
replicaCount: 1

image:
  # -- Worker image repository. THIS IS THE "custom node container" knob:
  # point it at your own image (e.g. metaloom/cortex-custom or metaloom/cortex-python)
  # to run a worker that advertises custom node kinds. Defaults to the stock worker.
  repository: metaloom/cortex-server
  # -- Image tag. Defaults to the chart's appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

# -- Image pull secrets for private registries (e.g. [ { name: regcred } ]).
imagePullSecrets: []

# -- Override the container entrypoint. Leave empty to use the image's own CMD.
# A custom image with a different entrypoint (e.g. the Python worker, which runs
# `python daemon.py`) sets these; the stock server image does not need them.
command: []
args: []

# Connection to the Loom backend. Cortex dials OUT to Loom; Loom never connects in.
loom:
  # -- Loom hostname (Service name when Loom runs in the same cluster).
  host: loom
  # -- Loom REST + WebSocket port.
  port: 8092
  # -- API token used to register and to write results back. Stored in a Secret.
  # Leave empty to run token-less (worker still registers and answers tasks, but
  # skips result persistence — the same graceful degradation as offline mode).
  token: ""
  # -- Use an existing Secret for the token instead of creating one.
  # The Secret must expose the token under the `token` key.
  existingSecret: ""

# -- Stable per-worker id reported at registration. Loom keys worker leases on it,
# so it MUST be stable across restarts — by default it is taken from the pod name
# (the StatefulSet ordinal), never a random suffix. Set a fixed value only for a
# single-replica deployment.
nodeId: ""

# -- Node kinds this worker advertises and runs. Empty means "all kinds the image
# supports". Rendered into CORTEX_NODE_WHITELIST (and CORTEX_NODE_KINDS, which the
# Python worker example reads). Example: [ "sha512", "thumbnail", "py-hello" ].
nodeKinds: []

# -- Node kinds to explicitly disable on this worker (CORTEX_NODE_BLACKLIST).
nodeBlacklist: []

# Local metadata / index directory (CORTEX_META_PATH).
meta:
  path: /meta
  persistence:
    # -- Persist the meta directory. A worker rebuilds it if lost, so this is optional.
    enabled: false
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 2Gi

# S3-compatible object storage. Enables the s3-source node AND the ability to read
# s3:// media generally. Objects are fetched lazily by whichever worker runs a node
# task against them, so these settings belong on EVERY worker that processes S3
# media - not only the one running the source node. In exchange, S3 pipelines need
# no shared media volume at all.
s3:
  # -- Enable S3 access on this worker.
  enabled: false
  # -- Endpoint override, e.g. http://minio:9000. Leave empty for real AWS.
  endpoint: ""
  region: us-east-1
  # -- Path-style bucket addressing. Required by MinIO and most S3 gateways.
  pathStyleAccess: true
  # -- Credentials. Leave empty to use the AWS default credential chain
  # (environment, profile, instance role, IRSA), which is preferable on EKS.
  accessKey: ""
  secretKey: ""
  # -- Use an existing secret with keys: accessKey, secretKey, webhookSecret.
  existingSecret: ""
  # -- Where fetched objects are cached. Defaults to <meta.path>/s3_bin when empty.
  cachePath: ""
  # -- Size budget for that cache in bytes; the oldest entries are evicted past it.
  maxCacheBytes: 53687091200
  # -- How long bucket notifications may be trusted before a full listing is forced.
  # Notifications can be lost, so this reconcile pass is what keeps scanning correct.
  reconcileIntervalMs: 21600000
  events:
    # -- Accept bucket notifications so runs can skip listing the bucket.
    enabled: false
    # -- WEBHOOK (bucket posts to the monitoring port) or SQS (worker polls a queue).
    mode: WEBHOOK
    # -- Shared secret the bucket must send in the X-Cortex-S3-Token header.
    webhookSecret: ""
    # -- SQS queue URL, when mode is SQS.
    queueUrl: ""

# Cloud drive access (Google Drive, OneDrive, SharePoint). Same deployment note as
# S3: files are fetched lazily by whichever worker runs a node task against them,
# so these settings belong on EVERY worker that processes cloud media - not only
# the one running the source node. A provider is only advertised as a runnable
# node kind when its credentials are present here, so Loom refuses a run the
# worker could not serve instead of dispatching one that dies mid-flight.
gdrive:
  # -- Enable Google Drive access on this worker.
  enabled: false
  # -- Service account key JSON. The production credential: it does not expire and
  # needs no interactive consent. Share the drive or folder with its client_email.
  serviceAccountJson: ""
  # -- User to impersonate through domain-wide delegation. Only needed to read an
  # individual's own My Drive rather than what was shared with the service account.
  impersonateSubject: ""
  # -- Shared drive used when a pipeline node names none. Empty = My Drive.
  defaultDriveId: ""
  # -- Use an existing secret with keys: serviceAccountJson, clientSecret, refreshToken.
  existingSecret: ""
  # -- Where fetched files are cached. Defaults to <meta.path>/gdrive_bin when empty.
  cachePath: ""
  # -- Size budget for that cache in bytes; the oldest entries are evicted past it.
  maxCacheBytes: 53687091200
  # -- How long the change feed may be trusted before a full folder walk is forced.
  # Longer than the S3 default because a delta feed is a provider guarantee rather
  # than a notification that can be lost; it exists only to repair subtree drift.
  reconcileIntervalMs: 86400000
  # -- Convert Google Docs, Sheets and Slides so they can be processed. Off by
  # default: conversion is lossy and Google caps it at 10 MB per document.
  exportNativeDocs: false
  # -- Refresh-token auth. Development only - a token from an app in "Testing"
  # publishing status expires after seven days and cannot be renewed unattended.
  clientId: ""
  clientSecret: ""
  refreshToken: ""

onedrive:
  # -- Enable OneDrive / SharePoint access on this worker.
  enabled: false
  # -- App-only credentials: the production mode. Register an application, give it
  # the Files.Read.All application permission, and grant admin consent.
  tenantId: ""
  clientId: ""
  clientSecret: ""
  # -- Drive used when a pipeline node names none. Effectively REQUIRED: an app-only
  # token has no /me, so there is no implicit drive to fall back on. Find one with
  # GET /sites/{hostname}:/sites/{path}:/drives.
  defaultDriveId: ""
  # -- Use an existing secret with keys: clientSecret, refreshToken.
  existingSecret: ""
  # -- Where fetched files are cached. Defaults to <meta.path>/onedrive_bin when empty.
  cachePath: ""
  # -- Size budget for that cache in bytes; the oldest entries are evicted past it.
  maxCacheBytes: 53687091200
  # -- How long the change feed may be trusted before a full folder walk is forced.
  reconcileIntervalMs: 86400000
  # -- Delegated refresh-token auth. Development only - Microsoft rotates the token
  # on every use and a stateless worker cannot persist the replacement.
  refreshToken: ""

# Shared media storage. Loom sends the worker a PATH to media, never the bytes,
# so the worker must be able to READ that path itself. Mount the same storage the
# Loom uploads volume uses (or wherever the source files live).
media:
  # -- Mount shared media into the worker.
  enabled: false
  # -- Mount path inside the container. Must match the paths Loom hands out.
  mountPath: /media
  # -- Volume source. Provide exactly one of: existingClaim, hostPath, or nfs.
  existingClaim: ""
  hostPath: ""
  nfs:
    server: ""
    path: ""
  # -- Mount read-only (workers only read source media).
  readOnly: true

# -- Extra environment variables (list of name/value or name/valueFrom maps).
extraEnv: []

# -- Extra YAML config mounted as cortex.yml (rarely needed; env wins on the
# server path). When set, rendered into a ConfigMap and mounted at /config/cortex.yml.
config: {}

# Monitoring HTTP server (health / readiness / metrics).
monitoring:
  # -- CORTEX_MONITORING_PORT. Serves /api/health, /api/ready and /metrics.
  port: 8093

livenessProbe:
  # -- Enable the liveness probe. Disable for a minimal custom image that does not
  # serve a monitoring port.
  enabled: true
  # -- Probe type: httpGet | tcpSocket | exec.
  type: httpGet
  httpPath: /api/health
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  # -- Enable the readiness probe. A worker is "ready" only once it has connected
  # to AND registered with Loom. Disable for a custom image without a /api/ready.
  enabled: true
  type: httpGet
  httpPath: /api/ready
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

service:
  # -- A headless Service fronting the monitoring port (health/metrics scraping).
  enabled: true
  type: ClusterIP
  port: 8093
  annotations: {}

resources:
  # requests/limits — set generous limits for GPU/AI nodes. The stock image ships
  # a CUDA runtime, so a GPU can be requested via limits (see below).
  requests:
    cpu: 250m
    memory: 512Mi
  limits: {}
  # -- Uncomment to request a GPU for face-detect / VLM / whisper workloads:
  #   limits:
  #     nvidia.com/gpu: 1

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

# The container images run as uid 1000, group root (gid 0).
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 0
  fsGroup: 0

securityContext: {}

nodeSelector: {}
tolerations: []
affinity: {}

# -- Optional PodDisruptionBudget.
podDisruptionBudget:
  enabled: false
  minAvailable: ""
  maxUnavailable: ""
