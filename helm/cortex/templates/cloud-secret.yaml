{{- /*
Google Drive and OneDrive credentials.

Rendered per provider, only when that provider is enabled, something to store was
given, and no existing secret was named. Kept out of the ConfigMap deliberately -
these are credentials, and the pipeline definition never carries them either,
because the editor's parameter model has no secret type.
*/ -}}
{{- if and .Values.gdrive.enabled (not .Values.gdrive.existingSecret) -}}
{{- if or .Values.gdrive.serviceAccountJson .Values.gdrive.clientSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cortex.gdriveSecretName" . }}
  labels:
    {{- include "cortex.labels" . | nindent 4 }}
type: Opaque
stringData:
  serviceAccountJson: {{ .Values.gdrive.serviceAccountJson | quote }}
  clientSecret: {{ .Values.gdrive.clientSecret | quote }}
  refreshToken: {{ .Values.gdrive.refreshToken | quote }}
{{- end }}
{{- end }}
{{- if and .Values.onedrive.enabled (not .Values.onedrive.existingSecret) }}
{{- if or .Values.onedrive.clientSecret .Values.onedrive.refreshToken }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cortex.onedriveSecretName" . }}
  labels:
    {{- include "cortex.labels" . | nindent 4 }}
type: Opaque
stringData:
  clientSecret: {{ .Values.onedrive.clientSecret | quote }}
  refreshToken: {{ .Values.onedrive.refreshToken | quote }}
{{- end }}
{{- end }}
