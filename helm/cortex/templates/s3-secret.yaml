{{- /*
S3 credentials and the bucket-notification shared secret.

Rendered only when S3 is enabled, something to store was given, and no existing
secret was named. Kept out of the ConfigMap deliberately: these are credentials,
and the pipeline definition never carries them either.
*/ -}}
{{- if and .Values.s3.enabled (not .Values.s3.existingSecret) -}}
{{- if or .Values.s3.accessKey .Values.s3.events.webhookSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cortex.s3SecretName" . }}
  labels:
    {{- include "cortex.labels" . | nindent 4 }}
type: Opaque
stringData:
  accessKey: {{ .Values.s3.accessKey | quote }}
  secretKey: {{ .Values.s3.secretKey | quote }}
  webhookSecret: {{ .Values.s3.events.webhookSecret | quote }}
{{- end }}
{{- end }}
