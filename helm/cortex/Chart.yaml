apiVersion: v2
name: cortex
description: >-
  MetaLoom Cortex — the media processing worker. Registers with a Loom backend
  over the processor WebSocket and runs the node tasks Loom dispatches (hashing,
  thumbnails, face detection, transcription, LLM/VLM, …). The image is
  overridable, so this same chart deploys the stock worker or a custom node image.
type: application
# Chart version — bump on chart changes.
version: 0.1.0
# The MetaLoom release the default image tracks. Overridable via image.tag.
appVersion: "latest"
home: https://metaloom.io
sources:
  - https://github.com/metaloom
keywords:
  - metaloom
  - cortex
  - media-processing
  - worker
maintainers:
  - name: MetaLoom
    url: https://metaloom.io
