apiVersion: v2
name: loom
description: >-
  MetaLoom Loom — the backend server (REST/gRPC/GraphQL API, database, auth,
  storage, MCP, pipeline engine and AI agent) plus the bundled web UI. Ships with
  an optional self-contained PostgreSQL for quick starts; use an external managed
  database in production.
type: application
# Chart version — bump on chart changes.
#
# 0.2.0 — the Deployment and Service selectors now pin
# app.kubernetes.io/component=server, so they no longer also match the bundled
# Postgres pod, and a wait-for-database init container gates startup. The
# selector change is not upgradeable in place (spec.selector is immutable):
# reinstall the release, or `helm upgrade --force`.
version: 0.2.0
# The MetaLoom release the default image tracks. Overridable via image.tag.
appVersion: "latest"
home: https://metaloom.io
sources:
  - https://github.com/metaloom
keywords:
  - metaloom
  - loom
  - dam
  - digital-asset-management
maintainers:
  - name: MetaLoom
    url: https://metaloom.io
