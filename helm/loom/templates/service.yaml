apiVersion: v1
kind: Service
metadata:
  name: {{ include "loom.fullname" . }}
  labels:
    {{- include "loom.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "loom.selectorLabels" . | nindent 4 }}
    # Required: the bundled Postgres StatefulSet shares the name/instance labels,
    # so without the component the Service would round-robin REST, gRPC and
    # WebSocket traffic between Loom and a Postgres pod that serves none of it.
    app.kubernetes.io/component: server
  ports:
    - name: rest
      port: {{ .Values.service.restPort }}
      targetPort: rest
      protocol: TCP
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
    - name: monitoring
      port: {{ .Values.service.monitoringPort }}
      targetPort: monitoring
      protocol: TCP
