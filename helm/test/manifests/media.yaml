# The shared media volume, plus a short-lived pod used to populate it.
#
# Cortex reads source media by path from a volume it mounts read-only, so the
# fixture has to be inside the cluster before the worker starts. There is no
# "kubectl cp into a PVC" — only into a running pod — hence the loader.
#
# run.sh applies this, waits for the loader, copies the fixture in, then deletes
# the loader so the ReadWriteOnce claim is free for Cortex.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loom-media
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: media-loader
  labels:
    app.kubernetes.io/name: media-loader
spec:
  restartPolicy: Never
  # Root on purpose: local-path hands out a directory owned by root, and the
  # fixture has to end up readable by Cortex's uid 1000. The pod is deleted as
  # soon as the copy is done.
  securityContext:
    runAsUser: 0
  containers:
    - name: loader
      image: busybox:1.36
      command: ["sh", "-c", "mkdir -p /media && sleep 3600"]
      volumeMounts:
        - name: media
          mountPath: /media
  volumes:
    - name: media
      persistentVolumeClaim:
        claimName: loom-media
